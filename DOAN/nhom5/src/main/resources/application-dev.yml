spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:dien_may_db.db}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:cuahangdienmay-9e28c-firebase-adminsdk-fbsvc-34dc57014a.json}

upload:
  dir: ./uploads/images

inventory:
  low-stock-threshold: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
