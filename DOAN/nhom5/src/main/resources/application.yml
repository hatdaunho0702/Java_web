spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:${SQLITE_DB_PATH:dien_may_db.db}}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.sqlite.JDBC
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    cache: false
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  application:
    name: nhom5
  profiles:
    active: dev
  mvc:
    favicon:
      enabled: false
  session:
    store-type: none
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

firebase:
  api-key: ${FIREBASE_WEB_API_KEY:AIzaSyDjcZpFjc51LWcOUL6w8ebsMiR0zGs_8F8}
  auth-domain: ${FIREBASE_AUTH_DOMAIN:cuahangdienmay-9e28c.firebaseapp.com}
  project-id: ${FIREBASE_PROJECT_ID:cuahangdienmay-9e28c}
  storage-bucket: ${FIREBASE_STORAGE_BUCKET:cuahangdienmay-9e28c.firebasestorage.app}
  messaging-sender-id: ${FIREBASE_MESSAGING_SENDER_ID:965631598853}
  app-id: ${FIREBASE_APP_ID:1:965631598853:web:2bd0bc786fad1807b1576c}
  measurement-id: ${FIREBASE_MEASUREMENT_ID:G-FFTW8YRE7B}
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:cuahangdienmay-9e28c-firebase-adminsdk-fbsvc-34dc57014a.json}

upload:
  dir: ./uploads/images

inventory:
  low-stock-threshold: 5

app:
  storage:
    product-image-dir: ${upload.dir}
  inventory:
    low-stock-threshold: ${inventory.low-stock-threshold}
  ai:
    github-token: ${GITHUB_MODELS_TOKEN:}
    model: gpt-4o-mini
    endpoint: https://models.inference.ai.azure.com

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.dienmay: DEBUG
    org.hibernate.SQL: WARN
  charset:
    console: UTF-8
