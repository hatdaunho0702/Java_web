<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)"

>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:replace="${title}">Admin Panel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body class="admin-body">
    <aside class="admin-sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a th:href="@{/admin}">⚡ ĐiệnMáy Pro</a>
        <small>Admin Panel</small>
      </div>
      <nav class="sidebar-nav">
        <a
          th:href="@{/admin/dashboard}"
          th:classappend="${activePage == 'dashboard'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-speedometer2"></i><span> Dashboard</span></a
        >
        <a
          th:href="@{/admin/products}"
          th:classappend="${activePage == 'products'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-box-seam"></i><span> Sản phẩm</span></a
        >
        <a
          th:href="@{/admin/orders}"
          th:classappend="${activePage == 'orders'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-receipt"></i><span> Đơn hàng</span></a
        >
        <a
          th:href="@{/admin/users}"
          th:classappend="${activePage == 'users'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-people"></i><span> Người dùng</span></a
        >
        <a
          th:href="@{/admin/categories}"
          th:classappend="${activePage == 'categories'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-grid"></i><span> Danh mục</span></a
        >
        <a
          th:href="@{/admin/coupons}"
          th:classappend="${activePage == 'coupons'} ? ' active'"
          class="sidebar-link"
          ><i class="bi bi-ticket-perforated"></i><span> Khuyến mãi</span></a
        >
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-user">
          <i class="bi bi-person-circle" style="font-size: 28px"></i>
          <div>
            <div id="adminName">Admin</div>
            <small id="adminEmail">admin@dienmaydemo.vn</small>
          </div>
        </div>
        <a href="#" onclick="logout()" class="sidebar-logout"
          ><i class="bi bi-box-arrow-right"></i> Đăng xuất</a
        >
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <h4 th:text="${pageTitle}" class="mb-0">Dashboard</h4>
        <div class="ms-auto d-flex align-items-center gap-3">
          <button class="nav-icon-btn position-relative">
            <i class="bi bi-bell"></i><span class="cart-badge">3</span>
          </button>
          <span
            id="topbarAdminName"
            style="font-size: 14px; font-weight: 600"
          ></span>
        </div>
      </header>
      <div class="admin-content">
        <div th:replace="${content}"></div>
      </div>
    </div>

    <script th:src="@{/js/firebase-config.js}" type="module"></script>
    <script th:src="@{/js/auth.js}" type="module"></script>
    <script th:src="@{/js/admin/dashboard.js}"></script>
    <script>
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
      }
      if (window.requireAdmin) {
        window.requireAdmin();
      }
    </script>
  </body>
</html>
