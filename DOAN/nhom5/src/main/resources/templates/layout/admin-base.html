<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:replace="${title}">Admin Panel — ElectraManager</title>
    <!-- Bootstrap CSS for layout utilities -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Tabler Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- Custom Style System -->
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <!-- Left Sidebar Panel -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">⚡</div>
        <div class="brand-name">ElectraManager</div>
      </div>
      
      <nav class="sidebar-menu">
        <a
          th:href="@{/admin/dashboard}"
          th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-layout-dashboard"></i>
          <span>Tổng quan</span>
        </a>
        <a
          th:href="@{/admin/products}"
          th:classappend="${activePage == 'products'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-device-tv"></i>
          <span>Sản phẩm</span>
        </a>
        <a
          th:href="@{/admin/categories}"
          th:classappend="${activePage == 'categories'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-category"></i>
          <span>Danh mục</span>
        </a>
        <a
          th:href="@{/admin/orders}"
          th:classappend="${activePage == 'orders'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-clipboard-list"></i>
          <span>Đơn hàng</span>
        </a>
        <a
          th:href="@{/admin/users}"
          th:classappend="${activePage == 'users'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-users"></i>
          <span>Người dùng</span>
        </a>
        <a
          th:href="@{/admin/coupons}"
          th:classappend="${activePage == 'coupons'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-discount"></i>
          <span>Khuyến mãi</span>
        </a>
        <a
          th:href="@{/admin/contact}"
          th:classappend="${activePage == 'contact'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-message"></i>
          <span>Tin nhắn</span>
          <!-- Badge unread -->
          <span id="sidebar-msg-badge"
                style="margin-left: auto;
                       background: var(--gradient-pink);
                       color: white;
                       border-radius: 12px;
                       padding: 2px 8px;
                       font-size: 11px;
                       font-weight: 700;
                       display: none">
            0
          </span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <i class="ti ti-user-circle" style="font-size: 32px; color: #fff;"></i>
        <div class="user-info">
          <span class="user-name" id="adminName">Admin</span>
          <span class="user-role" id="adminEmail">admin@dienmay.vn</span>
        </div>
        <a href="#" onclick="doLogout(); return false;" class="sidebar-logout ms-auto" title="Đăng xuất">
          <i class="ti ti-logout"></i>
        </a>
      </div>
    </aside>

    <!-- Right/Main Content Panel -->
    <main class="main-content">
      <!-- Header Component -->
      <header class="header">
        <div class="d-flex align-items-center gap-3">
          <button class="header-btn d-md-none" onclick="toggleSidebarMobile()">
            <i class="ti ti-menu-2"></i>
          </button>
          <button class="header-btn d-none d-md-flex" onclick="toggleSidebarDesktop()">
            <i class="ti ti-menu-2"></i>
          </button>
          <div class="header-title" th:text="${pageTitle}">Tổng quan hệ thống</div>
        </div>
        
        <div class="header-actions">
          <div class="header-search">
            <i class="ti ti-search"></i>
            <input type="text" placeholder="Tìm kiếm nhanh..." onkeyup="if(event.key === 'Enter') showToast('Tìm kiếm: ' + this.value, 'info')">
          </div>
          
          <!-- NOTIFICATION BELL DROPDOWN -->
          <div class="dropdown">
            <button class="header-btn dropdown-toggle" data-bs-toggle="dropdown" id="notifBtn" style="border: none; background: transparent; position: relative;">
              <i class="ti ti-bell"></i>
              <!-- Badge đỏ số lượng -->
              <span class="cart-badge" id="notifBadge" style="display: none; background: var(--gradient-pink); position: absolute; top: -5px; right: -5px; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border: 2px solid white;">
                0
              </span>
            </button>

            <!-- Dropdown notification -->
            <div class="dropdown-menu dropdown-menu-end p-0" style="width: 320px; border-radius: 12px; box-shadow: var(--card-shadow-hover); border: 1px solid var(--border-color); background: white;">
              <div style="padding: 16px 20px; background: var(--gradient-main); color: white; border-radius: 12px 12px 0 0;">
                <strong>🔔 Thông báo</strong>
              </div>

              <!-- Tin nhắn chưa đọc -->
              <div id="notif-messages" style="max-height: 300px; overflow-y: auto;">
                <div class="text-center py-3" style="color: var(--text-muted); font-size: 13px;">
                  Đang tải...
                </div>
              </div>

              <div style="padding: 12px 16px; border-top: 1px solid var(--border-color); text-align: center;">
                <a th:href="@{/admin/contact}" style="color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none;">
                  Xem tất cả tin nhắn →
                </a>
              </div>
            </div>
          </div>
          
          <img class="admin-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" alt="Admin" onclick="showToast('Hồ sơ cá nhân Admin', 'info')">
        </div>
      </header>

      <!-- Toast Container -->
      <div class="toast-container" id="toastContainer"></div>

      <!-- Page Section Wrapper -->
      <div class="page-section">
        <div th:replace="${content}"></div>
      </div>
    </main>

    <!-- Javascript Assets -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- admin-auth-bridge loads auth.js (ES Module) via dynamic import and exposes functions to window -->
    <script th:src="@{/js/admin-auth-bridge.js}"></script>
    <script th:src="@{/js/admin/dashboard.js}"></script>
    <script>
      function toggleSidebarDesktop() {
        document.getElementById("sidebar").classList.toggle("collapsed");
        document.querySelector(".main-content").classList.toggle("expanded");
      }
      function toggleSidebarMobile() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("mobile-open");
      }
      function doLogout() {
        if (window.logout) {
          window.logout();
        } else {
          localStorage.clear();
          location.href = '/login';
        }
      }
      function showToast(message, type = 'success') {
        const container = document.getElementById("toastContainer");
        if(!container) return;

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        
        const icons = {
          success: 'ti ti-circle-check toast-icon-success',
          danger: 'ti ti-circle-x toast-icon-danger',
          warning: 'ti ti-alert-triangle toast-icon-warning',
          info: 'ti ti-info-circle toast-icon-info'
        };

        const iconClass = icons[type] || icons.success;

        toast.innerHTML = `
          <i class="${iconClass}" style="font-size: 20px;"></i>
          <span>${message}</span>
        `;

        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => {
            toast.remove();
          }, 300);
        }, 3000);
      }
      window.showToast = showToast;

      // Real-time notification badge updater
      window.addEventListener('authReady', () => {
        async function loadBadge() {
          try {
            const headers = await window.getAuthHeaders();
            const res = await fetch('/api/admin/contact/badge', { headers });
            if (!res.ok) return;
            const data = await res.json();

            const badge = document.getElementById('notifBadge');
            const sidebarBadge = document.getElementById('sidebar-msg-badge');

            // Set main bell badge
            if (badge) {
              if (data.total > 0) {
                badge.textContent = data.total;
                badge.style.display = 'flex';
                // Update tab title
                document.title = `(${data.total}) ` + document.title.replace(/^\(\d+\) /, '');
              } else {
                badge.style.display = 'none';
                document.title = document.title.replace(/^\(\d+\) /, '');
              }
            }

            // Set sidebar message badge
            if (sidebarBadge) {
              if (data.unreadMessages > 0) {
                sidebarBadge.textContent = data.unreadMessages;
                sidebarBadge.style.display = 'inline-block';
              } else {
                sidebarBadge.style.display = 'none';
              }
            }

            // Render notification dropdown list
            loadNotifDropdown(headers);
          } catch(e) {
            console.debug('Badge error:', e);
          }
        }

        async function loadNotifDropdown(headers) {
          try {
            const res = await fetch('/api/admin/contact?status=UNREAD&size=5', { headers });
            if (!res.ok) return;
            const data = await res.json();
            const msgs = data.content || [];
            const el = document.getElementById('notif-messages');

            if (!el) return;

            if (msgs.length === 0) {
              el.innerHTML = `
                <div class="text-center py-4" style="color: var(--text-muted); font-size: 13px;">
                  <div style="font-size: 32px;">✅</div>
                  Không có thông báo mới
                </div>`;
              return;
            }

            el.innerHTML = msgs.map(m => `
              <a href="/admin/contact" style="display: flex; gap: 12px; padding: 12px 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); transition: background 0.2s" onmouseover="this.style.background='var(--bg-light)'" onmouseout="this.style.background=''">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-main); display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; flex-shrink: 0">
                  ${m.fromRegisteredUser ? '👤' : '✉️'}
                </div>
                <div style="flex: 1; min-width: 0">
                  <div style="font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main);">
                    ${m.senderName}
                  </div>
                  <div style="font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">
                    ${m.subject}
                  </div>
                  <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">
                    ${m.createdAt}
                  </div>
                </div>
                <div style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 6px;"></div>
              </a>`).join('');
          } catch(e) {}
        }

        // Run immediately and poll every 30 seconds
        loadBadge();
        setInterval(loadBadge, 30000);
      });
    </script>
  </body>
</html>
