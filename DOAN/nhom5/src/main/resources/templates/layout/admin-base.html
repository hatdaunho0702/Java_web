<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:replace="${title}">Admin Panel — ElectraManager</title>
    <!-- Bootstrap CSS for layout utilities -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Tabler Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- Custom Style System -->
    <link rel="stylesheet" th:href="@{/css/variables.css}" />
    <link rel="stylesheet" th:href="@{/css/admin.css}" />
  </head>
  <body>
    <!-- Left Sidebar Panel -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="logo-icon">⚡</div>
        <div class="brand-name">ElectraManager</div>
      </div>
      
      <nav class="sidebar-menu">
        <a
          th:href="@{/admin/dashboard}"
          th:classappend="${activePage == 'dashboard'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-layout-dashboard"></i>
          <span>Tổng quan</span>
        </a>
        <a
          th:href="@{/admin/products}"
          th:classappend="${activePage == 'products'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-device-tv"></i>
          <span>Sản phẩm</span>
        </a>
        <a
          th:href="@{/admin/categories}"
          th:classappend="${activePage == 'categories'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-category"></i>
          <span>Danh mục</span>
        </a>
        <a
          th:href="@{/admin/orders}"
          th:classappend="${activePage == 'orders'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-clipboard-list"></i>
          <span>Đơn hàng</span>
        </a>
        <a
          th:href="@{/admin/users}"
          th:classappend="${activePage == 'users'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-users"></i>
          <span>Người dùng</span>
        </a>
        <a
          th:href="@{/admin/coupons}"
          th:classappend="${activePage == 'coupons'} ? ' active' : ''"
          class="menu-item"
        >
          <i class="ti ti-discount"></i>
          <span>Khuyến mãi</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <i class="ti ti-user-circle" style="font-size: 32px; color: #fff;"></i>
        <div class="user-info">
          <span class="user-name" id="adminName">Admin</span>
          <span class="user-role" id="adminEmail">admin@dienmay.vn</span>
        </div>
        <a href="#" onclick="logout(); return false;" class="sidebar-logout ms-auto" title="Đăng xuất">
          <i class="ti ti-logout"></i>
        </a>
      </div>
    </aside>

    <!-- Right/Main Content Panel -->
    <main class="main-content">
      <!-- Header Component -->
      <header class="header">
        <div class="d-flex align-items-center gap-3">
          <button class="header-btn d-md-none" onclick="toggleSidebarMobile()">
            <i class="ti ti-menu-2"></i>
          </button>
          <button class="header-btn d-none d-md-flex" onclick="toggleSidebarDesktop()">
            <i class="ti ti-menu-2"></i>
          </button>
          <div class="header-title" th:text="${pageTitle}">Tổng quan hệ thống</div>
        </div>
        
        <div class="header-actions">
          <div class="header-search">
            <i class="ti ti-search"></i>
            <input type="text" placeholder="Tìm kiếm nhanh..." onkeyup="if(event.key === 'Enter') showToast('Tìm kiếm: ' + this.value, 'info')">
          </div>
          
          <button class="header-btn" onclick="showToast('Không có thông báo mới', 'info')">
            <i class="ti ti-bell"></i>
            <span class="dot"></span>
          </button>
          
          <img class="admin-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" alt="Admin" onclick="showToast('Hồ sơ cá nhân Admin', 'info')">
        </div>
      </header>

      <!-- Toast Container -->
      <div class="toast-container" id="toastContainer"></div>

      <!-- Page Section Wrapper -->
      <div class="page-section">
        <div th:replace="${content}"></div>
      </div>
    </main>

    <!-- Javascript Assets -->
    <script th:src="@{/js/firebase-config.js}" type="module"></script>
    <script th:src="@{/js/auth.js}" type="module"></script>
    <script th:src="@{/js/admin/dashboard.js}"></script>
    <script>
      function toggleSidebarDesktop() {
        document.getElementById("sidebar").classList.toggle("collapsed");
        document.querySelector(".main-content").classList.toggle("expanded");
      }
      function toggleSidebarMobile() {
        const sidebar = document.getElementById("sidebar");
        sidebar.classList.toggle("mobile-open");
      }
      function logout() {
        if (window.firebaseLogout) {
          window.firebaseLogout();
        } else {
          localStorage.clear();
          location.href = '/login';
        }
      }
      function showToast(message, type = 'success') {
        const container = document.getElementById("toastContainer");
        if(!container) return;

        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        
        const icons = {
          success: 'ti ti-circle-check toast-icon-success',
          danger: 'ti ti-circle-x toast-icon-danger',
          warning: 'ti ti-alert-triangle toast-icon-warning',
          info: 'ti ti-info-circle toast-icon-info'
        };

        const iconClass = icons[type] || icons.success;

        toast.innerHTML = `
          <i class="${iconClass}" style="font-size: 20px;"></i>
          <span>${message}</span>
        `;

        container.appendChild(toast);
        toast.offsetHeight; // trigger reflow
        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => {
            toast.remove();
          }, 300);
        }, 3000);
      }
      window.showToast = showToast;
    </script>
  </body>
</html>
