<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main
      class="container py-5"
      th:attr="data-product-id=${product != null ? product.id : 0}"
      id="product-detail-root"
    >
      <div id="product-detail-content" class="admin-card p-4">
        Đang tải chi tiết sản phẩm...
      </div>

      <section class="mt-4" id="related-section" style="display: none">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="section-title">Sản phẩm <span>liên quan</span></div>
          <a href="/products" style="color: var(--accent); font-weight: 600"
            >Xem thêm →</a
          >
        </div>
        <div class="section-divider"></div>
        <div class="row g-3" id="related-products"></div>
      </section>

      <script type="module">
        const root = document.getElementById("product-detail-root");
        const productId = Number(root?.dataset?.productId || 0);
        let detailData = null;

        async function getUserToken() {
          return localStorage.getItem("firebase_token");
        }

        function formatVND(v) {
          return Number(v || 0).toLocaleString("vi-VN") + "đ";
        }

        function stars(rating) {
          const r = Math.round(Number(rating || 0));
          return "★★★★★"
            .split("")
            .map((s, idx) => (idx < r ? "★" : "☆"))
            .join("");
        }

        function escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text || "";
          return div.innerHTML;
        }

        function renderDetail(data) {
          const images =
            data.imageUrls && data.imageUrls.length
              ? data.imageUrls
              : [data.thumbnailUrl].filter(Boolean);
          const stock = Number(data.stockQty || 0);
          const price = data.salePrice || data.originalPrice;
          const salePercent =
            data.salePrice &&
            data.originalPrice &&
            Number(data.originalPrice) > Number(data.salePrice)
              ? Math.round(
                  ((Number(data.originalPrice) - Number(data.salePrice)) /
                    Number(data.originalPrice)) *
                    100,
                )
              : 0;

          document.getElementById("product-detail-content").innerHTML = `
            <div class="row g-4">
              <div class="col-lg-5">
                <div class="admin-card p-3">
                  <div class="position-relative">
                    ${salePercent > 0 ? `<span class=\"badge-sale\" style=\"position:absolute;left:10px;top:10px\">-${salePercent}%</span>` : ""}
                    <img id="main-product-image" src="${images[0] || ""}" alt="${escapeHtml(data.name)}" class="img-fluid rounded" style="width:100%;max-height:440px;object-fit:cover;background:#f8fafc" />
                  </div>
                  <div class="d-flex gap-2 mt-3 flex-wrap" id="thumb-list">
                    ${images.map((img, idx) => `<button class=\"btn btn-sm ${idx === 0 ? "btn-primary" : "btn-outline-secondary"} thumb-btn\" data-image=\"${img}\">${idx + 1}</button>`).join("")}
                  </div>
                </div>
              </div>
              <div class="col-lg-7">
                <div class="section-title">${escapeHtml(data.name)}</div>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span style="color:#f59e0b;font-size:18px">${stars(data.averageRating)}</span>
                  <span class="text-muted">${Number(data.averageRating || 0).toFixed(1)} (${data.reviewCount || 0} đánh giá)</span>
                </div>
                <div class="mb-3">
                  ${data.salePrice ? `<span class=\"price-original\">${formatVND(data.originalPrice)}</span>` : ""}
                  <div class="${data.salePrice ? "price-sale" : "price-normal"}">${formatVND(price)}</div>
                  ${salePercent > 0 ? `<small class=\"text-danger\">Tiết kiệm ${salePercent}%</small>` : ""}
                </div>
                <div class="mb-3">
                  ${
                    stock > 0
                      ? `<span class=\"badge bg-success\">Còn hàng (${stock} sản phẩm)</span>`
                      : `<span class=\"badge bg-danger\">Hết hàng</span>`
                  }
                </div>
                <p>${escapeHtml(data.description || "")}</p>
                <div class="d-flex align-items-center gap-2 mt-3 mb-3">
                  <button class="btn btn-outline-secondary" id="qty-minus">-</button>
                  <input id="qty-input" type="number" min="1" max="${Math.max(stock, 1)}" value="1" class="form-control" style="width:96px;text-align:center" ${stock <= 0 ? "disabled" : ""}>
                  <button class="btn btn-outline-secondary" id="qty-plus">+</button>
                </div>
                <div class="d-flex gap-2 flex-wrap">
                  <button class="btn-add-cart" id="add-cart-btn" ${stock <= 0 ? "disabled" : ""}>${stock <= 0 ? "Hết hàng" : "🛒 Thêm vào giỏ"}</button>
                  <a href="/products" class="btn btn-outline-secondary">Quay lại</a>
                </div>
                <hr />
                <div>
                  <div><strong>Danh mục:</strong> ${escapeHtml(data.categoryName || "-")}</div>
                  <div><strong>Thương hiệu:</strong> ${escapeHtml(data.brandName || "-")}</div>
                </div>
              </div>
            </div>

            <div class="row g-4 mt-2">
              <div class="col-lg-6">
                <div class="admin-card p-3 h-100">
                  <h5 class="mb-3">Thông số kỹ thuật</h5>
                  <div class="table-responsive">
                    <table class="table table-sm mb-0">
                      <tbody>
                        ${
                          (data.specs || [])
                            .map(
                              (spec) => `
                          <tr>
                            <th style=\"width:40%\">${escapeHtml(spec.key)}</th>
                            <td>${escapeHtml(spec.value)}</td>
                          </tr>
                        `,
                            )
                            .join("") ||
                          '<tr><td colspan="2" class="text-muted">Chưa có thông số kỹ thuật</td></tr>'
                        }
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="admin-card p-3 h-100">
                  <h5 class="mb-3">Đánh giá sản phẩm</h5>
                  <form id="review-form" class="mb-3">
                    <div class="row g-2">
                      <div class="col-4">
                        <select id="review-rating" class="form-select">
                          <option value="5">5 sao</option>
                          <option value="4">4 sao</option>
                          <option value="3">3 sao</option>
                          <option value="2">2 sao</option>
                          <option value="1">1 sao</option>
                        </select>
                      </div>
                      <div class="col-8">
                        <input id="review-comment" class="form-control" placeholder="Chia sẻ cảm nhận của bạn" maxlength="500" />
                      </div>
                    </div>
                    <div class="mt-2 d-grid">
                      <button type="submit" class="btn btn-primary">Gửi đánh giá</button>
                    </div>
                  </form>
                  <div id="reviews-list"></div>
                  <div class="text-center mt-2">
                    <button id="load-more-reviews" class="btn btn-sm btn-outline-secondary">Xem thêm đánh giá</button>
                  </div>
                </div>
              </div>
            </div>
          `;

          document.querySelectorAll(".thumb-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document.getElementById("main-product-image").src =
                btn.dataset.image;
              document.querySelectorAll(".thumb-btn").forEach((b) => {
                b.classList.remove("btn-primary");
                b.classList.add("btn-outline-secondary");
              });
              btn.classList.remove("btn-outline-secondary");
              btn.classList.add("btn-primary");
            });
          });

          const qtyInput = document.getElementById("qty-input");
          const minusBtn = document.getElementById("qty-minus");
          const plusBtn = document.getElementById("qty-plus");
          minusBtn?.addEventListener("click", () => {
            const current = Number(qtyInput.value || 1);
            qtyInput.value = String(Math.max(1, current - 1));
          });
          plusBtn?.addEventListener("click", () => {
            const current = Number(qtyInput.value || 1);
            qtyInput.value = String(Math.min(stock, current + 1));
          });

          document
            .getElementById("add-cart-btn")
            ?.addEventListener("click", async () => {
              const qty = Math.max(
                1,
                Math.min(stock, Number(qtyInput.value || 1)),
              );
              if (typeof window.addToCart === "function") {
                await window.addToCart(productId, qty);
              }
            });

          renderReviews(data.reviews || []);
          renderRelated(data.related || []);
          bindReviewForm();
        }

        function renderReviews(reviews) {
          const box = document.getElementById("reviews-list");
          if (!box) return;
          if (!reviews.length) {
            box.innerHTML =
              '<div class="text-muted">Chưa có đánh giá nào.</div>';
            return;
          }
          box.innerHTML = reviews
            .map(
              (rv) => `
            <div class="border rounded p-2 mb-2">
              <div class="d-flex justify-content-between align-items-center">
                <strong>${escapeHtml(rv.userName || "Khách hàng")}</strong>
                <small class="text-muted">${new Date(rv.createdAt).toLocaleDateString("vi-VN")}</small>
              </div>
              <div style="color:#f59e0b">${stars(rv.rating)}</div>
              <div>${escapeHtml(rv.comment || "")}</div>
            </div>
          `,
            )
            .join("");
        }

        function renderRelated(items) {
          const section = document.getElementById("related-section");
          const box = document.getElementById("related-products");
          if (!box) return;
          if (!items.length) {
            section.style.display = "none";
            return;
          }
          section.style.display = "block";
          box.innerHTML = items
            .map((p) => {
              const price = p.salePrice || p.originalPrice;
              const stock = Number(p.stockQty || 0);
              return `
              <div class="col-6 col-md-4 col-lg-3">
                <div class="product-card">
                  <div class="product-img-wrapper">
                    ${p.thumbnailUrl ? `<img src="${p.thumbnailUrl}" alt="${escapeHtml(p.name)}">` : `<div style="font-size:56px">📦</div>`}
                  </div>
                  <div class="product-body">
                    <div class="product-name">${escapeHtml(p.name)}</div>
                    <div class="${p.salePrice ? "price-sale" : "price-normal"}">${formatVND(price)}</div>
                    <div class="d-grid gap-2 mt-2">
                      <button class="btn-add-cart related-add" data-id="${p.id}" ${stock <= 0 ? "disabled" : ""}>${stock <= 0 ? "Hết hàng" : "🛒 Thêm vào giỏ"}</button>
                      <a href="/products/${p.slug}" class="btn btn-outline-secondary btn-sm">Chi tiết</a>
                    </div>
                  </div>
                </div>
              </div>`;
            })
            .join("");

          document.querySelectorAll(".related-add").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (typeof window.addToCart === "function") {
                window.addToCart(Number(btn.dataset.id), 1);
              }
            });
          });
        }

        async function bindReviewForm() {
          const form = document.getElementById("review-form");
          const loadMoreBtn = document.getElementById("load-more-reviews");
          let reviewPage = 0;

          loadMoreBtn?.addEventListener("click", async () => {
            reviewPage += 1;
            const res = await fetch(
              `/api/products/${productId}/reviews?page=${reviewPage}&size=5`,
            );
            if (!res.ok) {
              if (typeof window.showToast === "function") {
                window.showToast("Không tải thêm được đánh giá", "error");
              }
              return;
            }
            const data = await res.json();
            const currentHtml =
              document.getElementById("reviews-list").innerHTML;
            if (!data.content || !data.content.length) {
              loadMoreBtn.disabled = true;
              loadMoreBtn.textContent = "Đã hiển thị hết";
              return;
            }
            const appendHtml = data.content
              .map(
                (rv) => `
              <div class="border rounded p-2 mb-2">
                <div class="d-flex justify-content-between align-items-center">
                  <strong>${escapeHtml(rv.userName || "Khách hàng")}</strong>
                  <small class="text-muted">${new Date(rv.createdAt).toLocaleDateString("vi-VN")}</small>
                </div>
                <div style="color:#f59e0b">${stars(rv.rating)}</div>
                <div>${escapeHtml(rv.comment || "")}</div>
              </div>`,
              )
              .join("");
            document.getElementById("reviews-list").innerHTML =
              currentHtml + appendHtml;
          });

          form?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const rating = Number(
              document.getElementById("review-rating").value || 5,
            );
            const comment = document
              .getElementById("review-comment")
              .value.trim();
            if (!comment) {
              if (typeof window.showToast === "function") {
                window.showToast("Vui lòng nhập nội dung đánh giá", "warning");
              }
              return;
            }

            const token = await getUserToken();
            if (!token) {
              if (typeof window.showToast === "function") {
                window.showToast("Vui lòng đăng nhập để đánh giá", "warning");
              }
              setTimeout(() => {
                window.location.href = "/login";
              }, 1200);
              return;
            }

            const res = await fetch(`/api/products/${productId}/reviews`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ rating, comment }),
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              if (typeof window.showToast === "function") {
                window.showToast(
                  data.message || "Gửi đánh giá thất bại",
                  "error",
                );
              }
              return;
            }

            if (typeof window.showToast === "function") {
              window.showToast(data.message || "Đã gửi đánh giá", "success");
            }
            form.reset();
          });
        }

        async function loadProductDetail() {
          if (!productId) {
            document.getElementById("product-detail-content").innerHTML =
              '<div class="alert alert-warning">Không tìm thấy sản phẩm.</div>';
            return;
          }
          const res = await fetch(`/api/products/${productId}`);
          if (!res.ok) {
            document.getElementById("product-detail-content").innerHTML =
              '<div class="alert alert-danger">Lỗi tải chi tiết sản phẩm.</div>';
            return;
          }
          detailData = await res.json();
          renderDetail(detailData);
        }

        await loadProductDetail();
      </script>
    </main>
  </body>
</html>
