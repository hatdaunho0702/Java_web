<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết sản phẩm — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main
      class="container pb-5"
      th:attr="data-product-id=${product != null ? product.id : 0}"
      id="product-detail-root"
    >
      <!-- Dynamic Breadcrumbs -->
      <div class="py-3">
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
          <ol class="breadcrumb mb-0 cyber-breadcrumb">
            <li class="breadcrumb-item cyber-breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item cyber-breadcrumb-item"><a href="/products">Catalog</a></li>
            <li class="breadcrumb-item cyber-breadcrumb-item" id="breadcrumb-category"><a href="/products">Smartphones</a></li>
            <li class="breadcrumb-item cyber-breadcrumb-item" id="breadcrumb-brand"><a href="/products">Brand</a></li>
            <li class="breadcrumb-item active fw-bold text-black" aria-current="page" id="breadcrumb-title">Product Detail</li>
          </ol>
        </nav>
      </div>

      <!-- Main Detail Content Card -->
      <div id="product-detail-content" class="reveal-on-scroll">
        <div class="p-5 text-center bg-white rounded-4 border">
          <div class="spinner-border text-dark" role="status">
            <span class="visually-hidden">Đang tải...</span>
          </div>
          <div class="mt-2 text-muted">Đang tải chi tiết sản phẩm...</div>
        </div>
      </div>

      <!-- Related Products Section -->
      <section class="mt-5 reveal-on-scroll" id="related-section" style="display: none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="section-title fw-bold" style="font-family: 'Sora', sans-serif;">Related <span>Products</span></div>
          <a href="/products" style="color: #000000; font-weight: 600; font-family: 'DM Sans', sans-serif;">See All →</a>
        </div>
        <div class="row g-4" id="related-products"></div>
      </section>

      <script type="module">
        const root = document.getElementById("product-detail-root");
        const productId = Number(root?.dataset?.productId || 0);
        let detailData = null;

        async function getUserToken() {
          if (typeof window.getToken === "function") {
            return await window.getToken();
          }
          return localStorage.getItem("firebase_token");
        }

        function formatVND(v) {
          return Number(v || 0).toLocaleString("vi-VN") + "đ";
        }

        function stars(rating) {
          const r = Math.round(Number(rating || 0));
          return "★★★★★"
            .split("")
            .map((s, idx) => (idx < r ? "★" : "☆"))
            .join("");
        }

        function escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text || "";
          return div.innerHTML;
        }

        function getSpecIcon(key) {
          const k = (key || "").toLowerCase();
          if (k.includes("màn hình") || k.includes("screen") || k.includes("kích thước")) return "bi-aspect-ratio";
          if (k.includes("cpu") || k.includes("vi xử lý") || k.includes("vi xử lí") || k.includes("bộ xử lý hình ảnh")) return "bi-cpu";
          if (k.includes("gpu") || k.includes("đồ họa")) return "bi-card-image";
          if (k.includes("động cơ") || k.includes("công suất") || k.includes("tốc độ") || k.includes("tần số")) return "bi-speedometer";
          if (k.includes("pin") || k.includes("battery") || k.includes("dung lượng") || k.includes("thời lượng")) return "bi-battery-full";
          if (k.includes("camera sau") || k.includes("camera chính") || k.includes("main camera")) return "bi-camera";
          if (k.includes("camera trước") || k.includes("selfie")) return "bi-camera-video";
          if (k.includes("hệ điều hành") || k.includes("os")) return "bi-braces";
          if (k.includes("kết nối") || k.includes("bluetooth")) return "bi-bluetooth";
          if (k.includes("kháng nước") || k.includes("chống nước") || k.includes("ipx") || k.includes("ip67") || k.includes("ip54")) return "bi-droplet-half";
          if (k.includes("chống ồn") || k.includes("khử tiếng ồn")) return "bi-earbuds";
          if (k.includes("âm thanh") || k.includes("driver") || k.includes("loa")) return "bi-soundwave";
          if (k.includes("nổi bật") || k.includes("tính năng") || k.includes("đặc biệt")) return "bi-star";
          if (k.includes("trọng lượng") || k.includes("nặng")) return "bi-box-seam";
          if (k.includes("loại") || k.includes("kiểu") || k.includes("chất liệu")) return "bi-info-circle";
          return "bi-sliders";
        }

        function getProductOptions(slug) {
          const s = slug || "";
          
          if (s.includes("may-giat-samsung")) {
            return {
              label: "Tùy chọn khối lượng:",
              options: ["9 Kg", "10 Kg", "11 Kg"],
              colors: []
            };
          }
          if (s.includes("tu-lanh-samsung-inverter-382l")) {
            return {
              label: "Tùy chọn dung tích:",
              options: ["382 Lít"],
              colors: []
            };
          }
          if (s.includes("tivi-lg-oled-55-inch-4k")) {
            return {
              label: "Tùy chọn:",
              options: ["Tiêu chuẩn"],
              colors: []
            };
          }
          if (s.includes("macbook-air-m3-13-inch")) {
            return {
              label: "Tùy chọn (RAM/SSD):",
              options: ["8GB | 256GB", "16GB | 512GB"],
              colors: []
            };
          }
          if (s.includes("iphone-14-pro-max")) {
            return {
              label: "Tùy chọn dung lượng:",
              options: ["128GB", "256GB", "512GB", "1TB"],
              colors: [
                { name: "Deep Purple", hex: "#3C2E3D" },
                { name: "Space Black", hex: "#1F2022" },
                { name: "Red", hex: "#A50011" },
                { name: "Gold", hex: "#F9E4B7" },
                { name: "Silver", hex: "#F2F1ED" }
              ]
            };
          }
          if (s.includes("samsung-galaxy-s24-ultra")) {
            return {
              label: "Tùy chọn dung lượng:",
              options: ["256GB", "512GB", "1TB"],
              colors: []
            };
          }
          if (s.includes("samsung-galaxy-s26-ultra")) {
            return {
              label: "Tùy chọn dung lượng:",
              options: ["256GB", "512GB", "1TB"],
              colors: []
            };
          }
          if (s.includes("xiaomi-redmi-note-10")) {
            return {
              label: "Tùy chọn dung lượng:",
              options: ["64GB", "128GB"],
              colors: []
            };
          }
          if (s.includes("redmi-note-13-pro-5g") || s.includes("xiaomi")) {
            return {
              label: "Tùy chọn dung lượng:",
              options: ["256GB", "512GB"],
              colors: []
            };
          }
          if (s.includes("op-lung-chong-soc-iphone")) {
            return {
              label: "Tùy chọn dòng máy:",
              options: ["iPhone 13 Pro Max", "iPhone 14 Pro Max", "iPhone 15 Pro Max"],
              colors: []
            };
          }
          if (s.includes("loa-jbl-charge-5")) {
            return {
              label: "",
              options: [],
              colors: [
                { name: "Đen", hex: "#000000" },
                { name: "Xanh Dương", hex: "#1E3A8A" },
                { name: "Xám", hex: "#808080" }
              ]
            };
          }
          if (s.includes("tai-nghe-tecno-buds")) {
            return {
              label: "",
              options: [],
              colors: [
                { name: "Trắng", hex: "#FFFFFF" },
                { name: "Đen", hex: "#000000" }
              ]
            };
          }
          if (s.includes("tai-nghe-chup-tai")) {
            return {
              label: "",
              options: [],
              colors: [
                { name: "Đỏ Đô", hex: "#800020" },
                { name: "Đen", hex: "#000000" }
              ]
            };
          }
          if (s.includes("tai-nghe-tws-jbl")) {
            return {
              label: "",
              options: [],
              colors: [
                { name: "Đen", hex: "#000000" },
                { name: "Trắng", hex: "#FFFFFF" }
              ]
            };
          }
          if (s.includes("tai-nghe-redmi-buds")) {
            return {
              label: "",
              options: [],
              colors: [
                { name: "Trắng", hex: "#FFFFFF" },
                { name: "Xanh nhạt", hex: "#ADD8E6" }
              ]
            };
          }

          // Fallback default
          return {
            label: "Tùy chọn:",
            options: ["Tiêu chuẩn"],
            colors: []
          };
        }

        window.selectColor = function(el) {
          const dots = el.parentElement.querySelectorAll(".cyber-color-dot");
          dots.forEach(d => d.classList.remove("active"));
          el.classList.add("active");
          if (typeof window.showToast === "function") {
            window.showToast("Đã chọn màu: " + el.title, "info");
          }
        };

        window.selectCapacity = function(el) {
          const boxes = el.parentElement.querySelectorAll(".cyber-capacity-box");
          boxes.forEach(b => b.classList.remove("active"));
          el.classList.add("active");
          if (typeof window.showToast === "function") {
            window.showToast("Đã chọn dung lượng: " + el.textContent.trim(), "info");
          }
        };

        window.toggleDetailWishlist = function(productId) {
          let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const idx = wishlist.indexOf(productId);
          const btn = document.getElementById("detail-wishlist-btn");
          
          if (idx > -1) {
            wishlist.splice(idx, 1);
            btn.classList.remove("active");
            btn.innerHTML = 'Add to Wishlist <i class="bi bi-heart ms-1"></i>';
            if (typeof window.showToast === "function") {
              window.showToast("Đã xóa khỏi danh sách yêu thích", "info");
            }
          } else {
            wishlist.push(productId);
            btn.classList.add("active");
            btn.innerHTML = 'Add to Wishlist <i class="bi bi-heart-fill ms-1"></i>';
            if (typeof window.showToast === "function") {
              window.showToast("Đã thêm vào danh sách yêu thích", "success");
            }
          }
          localStorage.setItem("wishlist", JSON.stringify(wishlist));
          updateWishlistCount();
        };

        window.toggleWishlist = function(productId, btnEl) {
          let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const idx = wishlist.indexOf(productId);
          const icon = btnEl.querySelector("i");
          if (idx > -1) {
            wishlist.splice(idx, 1);
            icon.className = "bi bi-heart text-muted";
            if (typeof window.showToast === "function") {
              window.showToast("Đã xóa khỏi danh sách yêu thích", "info");
            }
          } else {
            wishlist.push(productId);
            icon.className = "bi bi-heart-fill text-danger";
            if (typeof window.showToast === "function") {
              window.showToast("Đã thêm vào danh sách yêu thích", "success");
            }
          }
          localStorage.setItem("wishlist", JSON.stringify(wishlist));
          
          if (detailData && productId === detailData.id) {
            const detailBtn = document.getElementById("detail-wishlist-btn");
            if (detailBtn) {
              if (idx > -1) {
                detailBtn.classList.remove("active");
                detailBtn.innerHTML = 'Add to Wishlist <i class="bi bi-heart ms-1"></i>';
              } else {
                detailBtn.classList.add("active");
                detailBtn.innerHTML = 'Add to Wishlist <i class="bi bi-heart-fill ms-1"></i>';
              }
            }
          }
          updateWishlistCount();
        };

        function updateWishlistCount() {
          const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const badge = document.querySelector(".nav-link-cyber i.bi-heart");
          if (badge) {
            let badgeEl = badge.parentElement.querySelector(".wishlist-badge");
            if (!badgeEl) {
              badgeEl = document.createElement("span");
              badgeEl.className = "wishlist-badge";
              badgeEl.style = "position: absolute; top: -4px; right: -6px; background: #000000; color: #fff; border-radius: 999px; font-size: 9px; font-weight: 800; min-width: 14px; height: 14px; padding: 0 3px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid #fff;";
              badge.parentElement.appendChild(badgeEl);
              badge.parentElement.style.position = "relative";
            }
            badgeEl.textContent = wishlist.length;
            badgeEl.style.display = wishlist.length > 0 ? "inline-flex" : "none";
          }
        }

        function renderDetail(data) {
          const images =
            data.imageUrls && data.imageUrls.length
              ? data.imageUrls
              : [data.thumbnailUrl].filter(Boolean);
          const stock = Number(data.stockQty || 0);
          const price = data.salePrice || data.originalPrice;
          
          // Breadcrumbs binding
          document.getElementById("breadcrumb-category").innerHTML = `<a href="/products?categoryId=${data.categoryId || ""}">${escapeHtml(data.categoryName || "Smartphones")}</a>`;
          document.getElementById("breadcrumb-brand").innerHTML = `<a href="/products?brandId=${data.brandId || ""}">${escapeHtml(data.brandName || "Brand")}</a>`;
          document.getElementById("breadcrumb-title").textContent = data.name;

          // Thumbnail List Generation
          const thumbsHtml = images.map((img, idx) => `
            <button class="cyber-gallery-thumb-btn ${idx === 0 ? "active" : ""} thumb-btn" data-image="${img}">
              <img src="${img}" alt="${escapeHtml(data.name)} thumb" />
            </button>
          `).join("");

          // Specs Grid Generation
          const specsToRender = (data.specs || []).slice(0, 6);
          const specsCardsHtml = specsToRender.map(spec => {
            const iconClass = getSpecIcon(spec.key);
            return `
              <div class="cyber-spec-card">
                <div class="cyber-spec-icon"><i class="bi ${iconClass}"></i></div>
                <div class="cyber-spec-info">
                  <span class="cyber-spec-label">${escapeHtml(spec.key)}</span>
                  <span class="cyber-spec-value">${escapeHtml(spec.value)}</span>
                </div>
              </div>
            `;
          }).join("");
          const specsGridHtml = `
            <div class="cyber-specs-grid">
              ${specsCardsHtml}
            </div>
          `;

          // Options configuration
          const optConfig = getProductOptions(data.slug);
          
          let colorSelectorHtml = "";
          if (optConfig.colors && optConfig.colors.length > 0) {
            const colorDotsHtml = optConfig.colors.map((c, idx) => `
              <span class="cyber-color-dot ${idx === 0 ? "active" : ""}" style="background-color: ${c.hex}; ${c.hex === "#FFFFFF" ? "border: 1px solid #ccc;" : ""}" title="${escapeHtml(c.name)}" onclick="selectColor(this)"></span>
            `).join("");
            
            colorSelectorHtml = `
              <div class="cyber-color-selector">
                <span class="cyber-color-label">Select color:</span>
                <div class="cyber-color-dots">
                  ${colorDotsHtml}
                </div>
              </div>
            `;
          }

          let capacitySelectorHtml = "";
          if (optConfig.options && optConfig.options.length > 0) {
            const capacityBoxesHtml = optConfig.options.map((opt, idx) => `
              <div class="cyber-capacity-box ${idx === 0 ? "active" : ""}" onclick="selectCapacity(this)">
                ${escapeHtml(opt)}
              </div>
            `).join("");
            
            capacitySelectorHtml = `
              <div class="mb-3">
                ${optConfig.label ? `<span class="text-muted d-block mb-2" style="font-family: 'DM Sans', sans-serif; font-size: 14px;">${escapeHtml(optConfig.label)}</span>` : ""}
                <div class="cyber-capacity-selector">
                  ${capacityBoxesHtml}
                </div>
              </div>
            `;
          }

          // Wishlist Action Preparation
          const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const isWishlisted = wishlist.includes(data.id);
          const wishlistBtnText = isWishlisted ? 'Add to Wishlist <i class="bi bi-heart-fill ms-1"></i>' : 'Add to Wishlist <i class="bi bi-heart ms-1"></i>';
          const activeWishlistClass = isWishlisted ? "active" : "";
          const disabledAttr = stock <= 0 ? "disabled" : "";
          const cartBtnText = stock <= 0 ? "Out of Stock" : "Add to Cart";

          document.getElementById("product-detail-content").innerHTML = `
            <div class="row g-5">
              <!-- Left Column: Gallery -->
              <div class="col-lg-6">
                <div class="cyber-gallery-container">
                  <div class="cyber-gallery-thumbs">
                    ${thumbsHtml}
                  </div>
                  <div class="cyber-gallery-main">
                    <img id="main-product-image" src="${images[0] || ""}" alt="${escapeHtml(data.name)}" />
                  </div>
                </div>
              </div>

              <!-- Right Column: Info Details -->
              <div class="col-lg-6">
                <h1 class="fw-bold mb-2" style="font-family: 'Sora', sans-serif; font-size: 36px; line-height: 1.1;">${escapeHtml(data.name)}</h1>
                
                <div class="d-flex align-items-center gap-2 mb-3">
                  <span style="color:#f59e0b;font-size:18px">${stars(data.averageRating)}</span>
                  <span class="text-muted" style="font-family: 'DM Sans', sans-serif; font-size: 14px;">${Number(data.averageRating || 0).toFixed(1)} (${data.reviewCount || 0} reviews)</span>
                </div>

                <!-- Price Block -->
                <div class="d-flex align-items-baseline gap-2 mb-4">
                  <span style="font-size: 32px; font-weight: 700; font-family: 'Sora', sans-serif; color: #000000;">${formatVND(price)}</span>
                  ${data.salePrice ? `<span class="text-muted text-decoration-line-through" style="font-size: 20px; font-family: 'Sora', sans-serif;">${formatVND(data.originalPrice)}</span>` : ""}
                </div>

                <!-- Color selector -->
                ${colorSelectorHtml}

                <!-- Capacity options -->
                ${capacitySelectorHtml}

                <!-- 3x2 Specs Grid -->
                ${specsGridHtml}

                <p class="text-muted mb-4" style="font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6;">${escapeHtml(data.description || "")}</p>
                
                <!-- Quantity & Buy buttons -->
                <div class="d-flex align-items-center gap-2 mb-3" style="font-family: 'DM Sans', sans-serif;">
                  <span class="text-muted me-2">Quantity:</span>
                  <button class="btn btn-sm btn-outline-dark" id="qty-minus" style="width: 32px; height: 32px; padding: 0;">-</button>
                  <input id="qty-input" type="number" min="1" max="${Math.max(stock, 1)}" value="1" class="form-control text-center" style="width: 60px; height: 32px; padding: 0; font-weight: bold;" ${stock <= 0 ? "disabled" : ""}>
                  <button class="btn btn-sm btn-outline-dark" id="qty-plus" style="width: 32px; height: 32px; padding: 0;">+</button>
                  <span class="text-muted ms-2" style="font-size: 13px;">(Stock: ${stock})</span>
                </div>

                <div class="cyber-actions-wrapper">
                  <button class="btn-cyber-wishlist ${activeWishlistClass}" id="detail-wishlist-btn" onclick="toggleDetailWishlist(${data.id})">
                    ${wishlistBtnText}
                  </button>
                  <button class="btn-cyber-cart" id="add-cart-btn" ${disabledAttr}>
                    ${cartBtnText}
                  </button>
                </div>

                <!-- Features Row -->
                <div class="cyber-features-row">
                  <div class="cyber-feature-card">
                    <div class="cyber-feature-icon"><i class="bi bi-truck"></i></div>
                    <div class="cyber-feature-text">
                      <span class="cyber-feature-title">Free Delivery</span>
                      <span class="cyber-feature-desc">1-2 day</span>
                    </div>
                  </div>
                  <div class="cyber-feature-card">
                    <div class="cyber-feature-icon"><i class="bi bi-shop"></i></div>
                    <div class="cyber-feature-text">
                      <span class="cyber-feature-title">In Stock</span>
                      <span class="cyber-feature-desc">Today</span>
                    </div>
                  </div>
                  <div class="cyber-feature-card">
                    <div class="cyber-feature-icon"><i class="bi bi-shield-check"></i></div>
                    <div class="cyber-feature-text">
                      <span class="cyber-feature-title">Guaranteed</span>
                      <span class="cyber-feature-desc">1 year</span>
                    </div>
                  </div>
                </div>

              </div>
            </div>

            <!-- Lower Layout: Specifications Details and Reviews -->
            <div class="row g-4 mt-2">
              <div class="col-lg-6">
                <div class="border rounded-4 p-4 bg-white h-100">
                  <h5 class="fw-bold mb-3" style="font-family: 'Sora', sans-serif;">Full Specifications</h5>
                  <div class="table-responsive">
                    <table class="table table-sm mb-0 align-middle" style="font-family: 'DM Sans', sans-serif; font-size: 14px;">
                      <tbody>
                        ${
                          (data.specs || [])
                            .map(
                              (spec) => `
                          <tr>
                            <th class="py-2 text-muted fw-normal" style="width:40%">${escapeHtml(spec.key)}</th>
                            <td class="py-2 fw-semibold text-dark">${escapeHtml(spec.value)}</td>
                          </tr>
                        `,
                            )
                            .join("") ||
                          '<tr><td colspan="2" class="text-muted py-3">Chưa có thông số kỹ thuật</td></tr>'
                        }
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="border rounded-4 p-4 bg-white h-100">
                  <h5 class="fw-bold mb-3" style="font-family: 'Sora', sans-serif;">Customer Reviews</h5>
                  <form id="review-form" class="mb-4">
                    <div class="row g-2">
                      <div class="col-4">
                        <select id="review-rating" class="form-select form-select-sm">
                          <option value="5">5 sao</option>
                          <option value="4">4 sao</option>
                          <option value="3">3 sao</option>
                          <option value="2">2 sao</option>
                          <option value="1">1 sao</option>
                        </select>
                      </div>
                      <div class="col-8">
                        <input id="review-comment" class="form-control form-control-sm" placeholder="Chia sẻ cảm nhận của bạn" maxlength="500" />
                      </div>
                    </div>
                    <div class="mt-2 d-grid">
                      <button type="submit" class="btn btn-sm btn-dark">Gửi đánh giá</button>
                    </div>
                  </form>
                  <div id="reviews-list"></div>
                  <div class="text-center mt-3">
                    <button id="load-more-reviews" class="btn btn-sm btn-outline-dark">Xem thêm đánh giá</button>
                  </div>
                </div>
              </div>
            </div>
          `;

          // Gallery thumbnail clicks handler
          document.querySelectorAll(".thumb-btn").forEach((btn) => {
            btn.addEventListener("click", () => {
              document.getElementById("main-product-image").src = btn.dataset.image;
              document.querySelectorAll(".thumb-btn").forEach((b) => {
                b.classList.remove("active");
              });
              btn.classList.add("active");
            });
          });

          // Quantity adjustments handler
          const qtyInput = document.getElementById("qty-input");
          const minusBtn = document.getElementById("qty-minus");
          const plusBtn = document.getElementById("qty-plus");
          minusBtn?.addEventListener("click", () => {
            const current = Number(qtyInput.value || 1);
            qtyInput.value = String(Math.max(1, current - 1));
          });
          plusBtn?.addEventListener("click", () => {
            const current = Number(qtyInput.value || 1);
            qtyInput.value = String(Math.min(stock, current + 1));
          });

          // Add to Cart handler
          document.getElementById("add-cart-btn")?.addEventListener("click", async () => {
            const qty = Math.max(1, Math.min(stock, Number(qtyInput.value || 1)));
            if (typeof window.addToCart === "function") {
              await window.addToCart(productId, qty);
            }
          });

          renderReviews(data.reviews || []);
          renderRelated(data.related || []);
          bindReviewForm();
          
          if (typeof window.initScrollReveal === "function") {
            window.initScrollReveal();
          }
        }

        function renderReviews(reviews) {
          const box = document.getElementById("reviews-list");
          if (!box) return;
          if (!reviews.length) {
            box.innerHTML = '<div class="text-muted py-2" style="font-family: \'DM Sans\', sans-serif; font-size: 13.5px;">Chưa có đánh giá nào.</div>';
            return;
          }
          box.innerHTML = reviews
            .map(
              (rv) => `
            <div class="border-bottom py-3 mb-2" style="font-family: 'DM Sans', sans-serif;">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <strong class="text-dark" style="font-size: 14px;">${escapeHtml(rv.userName || "Khách hàng")}</strong>
                <small class="text-muted" style="font-size: 12px;">${new Date(rv.createdAt).toLocaleDateString("vi-VN")}</small>
              </div>
              <div class="mb-2" style="color:#f59e0b; font-size: 13px;">${stars(rv.rating)}</div>
              <div style="font-size: 14.5px; color: #4b5563;">${escapeHtml(rv.comment || "")}</div>
            </div>
          `,
            )
            .join("");
        }

        function renderRelated(items) {
          const section = document.getElementById("related-section");
          const box = document.getElementById("related-products");
          if (!box) return;
          if (!items.length) {
            section.style.display = "none";
            return;
          }
          section.style.display = "block";
          
          const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");

          box.innerHTML = items
            .map((p, idx) => {
              const price = p.salePrice || p.originalPrice;
              const stock = Number(p.stockQty || 0);
              const disabled = stock <= 0;
              const isWishlisted = wishlist.includes(p.id);
              const heartIconClass = isWishlisted ? "bi-heart-fill text-danger" : "bi-heart text-muted";

              return `
              <div class="col-6 col-md-4 col-lg-3 reveal-on-scroll" data-delay-index="${idx % 4}">
                <div class="cyber-product-card" data-product-id="${p.id}">
                  <button class="wishlist-btn" onclick="event.stopPropagation(); toggleWishlist(${p.id}, this)">
                    <i class="bi ${heartIconClass}"></i>
                  </button>
                  <div class="cyber-product-img-wrapper" style="cursor: pointer" onclick="location.href='/products/${p.slug}'">
                    ${p.thumbnailUrl ? `<img class="cyber-product-img" src="${p.thumbnailUrl}" alt="${escapeHtml(p.name)}">` : `<div style="font-size:56px">📦</div>`}
                  </div>
                  <div>
                    <div class="cyber-product-title" style="cursor: pointer" onclick="location.href='/products/${p.slug}'">${escapeHtml(p.name)}</div>
                    <div class="cyber-product-price">${formatVND(price)}</div>
                  </div>
                  <button class="btn-buy-now btn-add-cart" data-product-id="${p.id}" ${disabled ? "disabled" : ""}>
                    ${disabled ? "Hết hàng" : "Buy Now"}
                  </button>
                </div>
              </div>`;
            })
            .join("");

          if (typeof window.initScrollReveal === "function") {
            window.initScrollReveal();
          }

          document.querySelectorAll(".related-add").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (typeof window.addToCart === "function") {
                window.addToCart(Number(btn.dataset.id), 1);
              }
            });
          });
        }

        async function bindReviewForm() {
          const form = document.getElementById("review-form");
          const loadMoreBtn = document.getElementById("load-more-reviews");
          let reviewPage = 0;

          async function refreshReviews() {
            reviewPage = 0;
            const res = await fetch(`/api/products/${productId}/reviews?page=0&size=5`);
            if (res.ok) {
              const data = await res.json();
              renderReviews(data.content || []);
              if (loadMoreBtn) {
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = "Xem thêm đánh giá";
              }
            }
          }

          loadMoreBtn?.addEventListener("click", async () => {
            reviewPage += 1;
            const res = await fetch(`/api/products/${productId}/reviews?page=${reviewPage}&size=5`);
            if (!res.ok) {
              if (typeof window.showToast === "function") {
                window.showToast("Không tải thêm được đánh giá", "error");
              }
              return;
            }
            const data = await res.json();
            const currentHtml = document.getElementById("reviews-list").innerHTML;
            if (!data.content || !data.content.length) {
              loadMoreBtn.disabled = true;
              loadMoreBtn.textContent = "Đã hiển thị hết";
              return;
            }
            const appendHtml = data.content
              .map(
                (rv) => `
              <div class="border-bottom py-3 mb-2" style="font-family: 'DM Sans', sans-serif;">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <strong class="text-dark" style="font-size: 14px;">${escapeHtml(rv.userName || "Khách hàng")}</strong>
                  <small class="text-muted" style="font-size: 12px;">${new Date(rv.createdAt).toLocaleDateString("vi-VN")}</small>
                </div>
                <div class="mb-2" style="color:#f59e0b; font-size: 13px;">${stars(rv.rating)}</div>
                <div style="font-size: 14.5px; color: #4b5563;">${escapeHtml(rv.comment || "")}</div>
              </div>`,
              )
              .join("");
            document.getElementById("reviews-list").innerHTML = currentHtml + appendHtml;
          });

          form?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const rating = Number(document.getElementById("review-rating").value || 5);
            const comment = document.getElementById("review-comment").value.trim();
            if (!comment) {
              if (typeof window.showToast === "function") {
                window.showToast("Vui lòng nhập nội dung đánh giá", "warning");
              }
              return;
            }

            const token = await getUserToken();
            if (!token) {
              if (typeof window.showToast === "function") {
                window.showToast("Vui lòng đăng nhập để đánh giá", "warning");
              }
              setTimeout(() => {
                window.location.href = "/login";
              }, 1200);
              return;
            }

            const res = await fetch(`/api/products/${productId}/reviews`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ rating, comment }),
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
              if (typeof window.showToast === "function") {
                window.showToast(data.message || "Gửi đánh giá thất bại", "error");
              }
              return;
            }

            if (typeof window.showToast === "function") {
              window.showToast(data.message || "Đã gửi đánh giá", "success");
            }
            form.reset();
            await refreshReviews();
          });
        }

        async function loadProductDetail() {
          if (!productId) {
            document.getElementById("product-detail-content").innerHTML =
              '<div class="alert alert-warning">Không tìm thấy sản phẩm.</div>';
            return;
          }
          const res = await fetch(`/api/products/${productId}`);
          if (!res.ok) {
            document.getElementById("product-detail-content").innerHTML =
              '<div class="alert alert-danger">Lỗi tải chi tiết sản phẩm.</div>';
            return;
          }
          detailData = await res.json();
          renderDetail(detailData);
        }

        await loadProductDetail();
        updateWishlistCount();
      </script>
    </main>
  </body>
</html>
