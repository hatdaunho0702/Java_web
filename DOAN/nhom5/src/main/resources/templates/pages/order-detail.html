<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"

>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết đơn hàng — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main class="container py-5">
      <div class="section-title mb-3">Chi tiết đơn hàng</div>
      <div class="admin-card p-4">
        <div th:if="${orderId != null}">
          Mã đơn: <strong th:text="${orderId}">0</strong>
        </div>
        <div th:unless="${orderId != null}">Chưa có dữ liệu đơn hàng.</div>
      </div>
    </main>
  </body>
</html>
