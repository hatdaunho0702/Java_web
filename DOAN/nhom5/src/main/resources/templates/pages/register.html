<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main class="container py-5">
      <div class="login-panel reveal-on-scroll">
        <div class="text-center mb-4">
          <div style="font-size: 44px">⚡</div>
          <h3 class="fw-bold mb-1">Đăng ký</h3>
          <p class="text-muted mb-0">Tạo tài khoản hệ thống đám mây Firebase</p>
        </div>
        <div
          id="error-message"
          style="
            display: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #fca5a5;
          "
        ></div>
        <div
          id="success-message"
          style="
            display: none;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #86efac;
          "
        ></div>
        <form id="registerForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              id="email"
              type="email"
              class="form-control"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Họ và tên</label>
            <input
              id="fullName"
              type="text"
              class="form-control"
              placeholder="Nguyen Van A"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Số điện thoại</label>
            <input
              id="phone"
              type="tel"
              class="form-control"
              placeholder="0901234567"
            />
          </div>
          <button
            type="submit"
            class="btn-add-cart w-100"
            id="register-submit-btn"
          >
            Đăng ký
          </button>
        </form>
        <div class="text-center mt-3">
          <p class="small text-muted">
            Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a>
          </p>
        </div>
      </div>

      <script th:src="@{/js/pages/register.js}" type="module"></script>
    </main>
  </body>
</html>
