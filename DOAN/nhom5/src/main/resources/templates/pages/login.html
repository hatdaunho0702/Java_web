<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"

>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main class="container py-5">
      <div class="login-panel">
        <div class="text-center mb-4">
          <div style="font-size: 44px">⚡</div>
          <h3 class="fw-bold mb-1">Đăng nhập</h3>
          <p class="text-muted mb-0">Thymeleaf + Firebase front-end scaffold</p>
        </div>
        <form>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="you@example.com"
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input
              type="password"
              class="form-control"
              placeholder="••••••••"
            />
          </div>
          <button type="button" class="btn-add-cart w-100">Đăng nhập</button>
        </form>
      </div>
    </main>
  </body>
</html>
