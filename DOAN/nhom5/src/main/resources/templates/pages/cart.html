<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng — ĐiệnMáy Pro</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main class="container py-5">
      <div id="cart-content" class="admin-card p-4 reveal-on-scroll"></div>

      <script type="module">
        import { getFirebaseAuth } from "/js/firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        function formatVnd(value) {
          return Number(value || 0).toLocaleString("vi-VN") + "đ";
        }

        function showToastSafe(message, type = "info") {
          if (typeof window.showToast === "function") {
            window.showToast(message, type);
          }
        }

        async function getAuthToken() {
          const auth = await getFirebaseAuth();
          const user = auth.currentUser;
          if (!user) {
            return null;
          }
          return await user.getIdToken(true);
        }

        async function loadCart() {
          const auth = await getFirebaseAuth();
          onAuthStateChanged(auth, async (user) => {
            if (!user) {
              document.getElementById("cart-content").innerHTML = `
                <div class="text-center py-5">
                  <div style="font-size:80px">🛒</div>
                  <h4>Giỏ hàng trống</h4>
                  <p class="text-muted">Vui lòng đăng nhập để xem giỏ hàng</p>
                  <a href="/login" class="btn btn-primary px-4 py-2">Đăng nhập</a>
                </div>`;
              return;
            }

            try {
              const token = await user.getIdToken(true);
              const res = await fetch("/api/cart", {
                headers: { Authorization: "Bearer " + token },
              });

              if (!res.ok) {
                throw new Error("Lỗi tải giỏ hàng");
              }

              const items = await res.json();

              if (!items || items.length === 0) {
                document.getElementById("cart-content").innerHTML = `
                  <div class="text-center py-5">
                    <div style="font-size:80px">🛒</div>
                    <h4>Giỏ hàng của bạn đang trống</h4>
                    <a href="/products" class="btn btn-primary px-4 py-2 mt-3">
                      Tiếp tục mua sắm
                    </a>
                  </div>`;
                return;
              }

              renderCartTable(items, token);
            } catch (err) {
              document.getElementById("cart-content").innerHTML =
                '<div class="alert alert-danger">Lỗi tải giỏ hàng</div>';
            }
          });
        }

        function renderCartTable(items, token) {
          let subtotal = 0;
          const rows = items
            .map((item) => {
              const unitPrice = Number(item.unitPrice || 0);
              const lineTotal = unitPrice * Number(item.quantity || 0);
              subtotal += lineTotal;
              const imgOrEmoji = item.thumbnailUrl
                ? `<img src="${item.thumbnailUrl}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">`
                : `<div style="width:70px;height:70px;background:#f0f0f0;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px">📦</div>`;

              return `
                <tr id="row-${item.cartItemId}">
                  <td>
                    <div class="d-flex align-items-center gap-3">
                      ${imgOrEmoji}
                      <div>
                        <div style="font-weight:600">${item.productName}</div>
                        <small class="text-muted">Còn ${item.stockQty} trong kho</small>
                      </div>
                    </div>
                  </td>
                  <td class="text-center">${formatVnd(unitPrice)}</td>
                  <td class="text-center">
                    <div class="d-flex align-items-center justify-content-center gap-2">
                      <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.cartItemId}, ${item.quantity - 1}, ${item.stockQty})">-</button>
                      <span id="qty-${item.cartItemId}" style="min-width:30px;text-align:center;font-weight:600">${item.quantity}</span>
                      <button class="btn btn-sm btn-outline-secondary" onclick="changeQty(${item.cartItemId}, ${item.quantity + 1}, ${item.stockQty})">+</button>
                    </div>
                  </td>
                  <td class="text-center" id="sub-${item.cartItemId}" style="font-weight:700;color:var(--primary)">
                    ${formatVnd(lineTotal)}
                  </td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.cartItemId})">
                      <i class="bi bi-trash"></i>
                    </button>
                  </td>
                </tr>`;
            })
            .join("");

          const discount = 0;
          const shipping = subtotal >= 500000 ? 0 : 30000;
          const total = subtotal + shipping - discount;

          document.getElementById("cart-content").innerHTML = `
            <div class="row g-4">
              <div class="col-lg-8">
                <div class="admin-card">
                  <div class="admin-card-header d-flex justify-content-between align-items-center">
                    <span>🛒 Giỏ hàng của bạn</span>
                    <span class="badge bg-primary">${items.length} sản phẩm</span>
                  </div>
                  <div class="table-responsive">
                    <table class="table admin-table mb-0">
                      <thead>
                        <tr>
                          <th>Sản phẩm</th>
                          <th class="text-center">Đơn giá</th>
                          <th class="text-center">Số lượng</th>
                          <th class="text-center">Thành tiền</th>
                          <th class="text-center">Xóa</th>
                        </tr>
                      </thead>
                      <tbody>${rows}</tbody>
                    </table>
                  </div>
                </div>
              </div>

              <div class="col-lg-4">
                <div class="admin-card">
                  <div class="admin-card-header">📋 Tóm tắt đơn hàng</div>
                  <div class="p-4">
                    <div class="d-flex gap-2 mb-3">
                      <input type="text" id="couponInput" class="form-control" placeholder="Nhập mã giảm giá">
                      <button class="btn btn-primary px-3" onclick="applyCoupon()">Áp dụng</button>
                    </div>
                    <div id="coupon-msg" class="mb-3" style="font-size:13px"></div>

                    <div class="d-flex justify-content-between mb-2">
                      <span>Tạm tính:</span>
                      <span id="subtotal-display">${formatVnd(subtotal)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                      <span>Giảm giá:</span>
                      <span id="discount-display" style="color:var(--primary)">-0đ</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                      <span>Phí vận chuyển:</span>
                      <span id="shipping-display">${shipping === 0 ? "Miễn phí" : formatVnd(shipping)}</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                      <strong>Tổng thanh toán:</strong>
                      <strong id="total-display" style="font-size:20px;color:var(--primary)">${formatVnd(total)}</strong>
                    </div>
                    <a href="/checkout" class="btn btn-primary d-block text-center py-3" style="border-radius:10px;font-size:16px">
                      Tiến hành thanh toán →
                    </a>
                    <a href="/products" class="d-block text-center mt-2 text-muted" style="font-size:14px">
                      ← Tiếp tục mua sắm
                    </a>
                  </div>
                </div>
              </div>
            </div>`;

          window._cartToken = token;
          if (typeof window.initScrollReveal === "function") {
            window.initScrollReveal();
          }
        }

        window.changeQty = async function (cartItemId, newQty, stockQty) {
          if (newQty < 1) {
            if (confirm("Xóa sản phẩm này khỏi giỏ hàng?")) {
              removeItem(cartItemId);
            }
            return;
          }

          if (newQty > stockQty) {
            showToastSafe(
              "Chỉ còn " + stockQty + " sản phẩm trong kho",
              "warning",
            );
            return;
          }

          try {
            const token = window._cartToken || (await getAuthToken());
            const res = await fetch("/api/cart/" + cartItemId, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ quantity: newQty }),
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.message || "Không thể cập nhật giỏ hàng");
            }
            await loadCart();
            if (typeof window.updateCartBadge === "function") {
              await window.updateCartBadge();
            }
            showToastSafe("Đã cập nhật", "success");
          } catch (err) {
            showToastSafe(err.message || "Lỗi cập nhật", "error");
          }
        };

        window.removeItem = async function (cartItemId) {
          if (!confirm("Xóa sản phẩm này khỏi giỏ hàng?")) {
            return;
          }
          try {
            const token = window._cartToken || (await getAuthToken());
            const res = await fetch("/api/cart/" + cartItemId, {
              method: "DELETE",
              headers: { Authorization: "Bearer " + token },
            });
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              throw new Error(err.message || "Không thể xóa sản phẩm");
            }
            document.getElementById("row-" + cartItemId)?.remove();
            await loadCart();
            if (typeof window.updateCartBadge === "function") {
              await window.updateCartBadge();
            }
            showToastSafe("Đã xóa khỏi giỏ hàng", "success");
          } catch (err) {
            showToastSafe(err.message || "Lỗi khi xóa", "error");
          }
        };

        window.applyCoupon = async function () {
          const code = document.getElementById("couponInput")?.value?.trim();
          if (!code) {
            showToastSafe("Nhập mã giảm giá", "warning");
            return;
          }

          const subtotalEl = document.getElementById("subtotal-display");
          const subtotalVal = Number(
            subtotalEl.textContent.replace(/[^\d]/g, "") || "0",
          );

          try {
            const token = window._cartToken || (await getAuthToken());
            const res = await fetch("/api/coupon/validate", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ code: code, orderTotal: subtotalVal }),
            });
            const data = await res.json();
            const msgEl = document.getElementById("coupon-msg");

            if (data.valid) {
              msgEl.innerHTML =
                '<span style="color:green">✅ ' + data.message + "</span>";
              const discountVal = Number(data.discountAmount || 0);
              document.getElementById("discount-display").textContent =
                "-" + formatVnd(discountVal);
              const shipping = subtotalVal >= 500000 ? 0 : 30000;
              const total = subtotalVal - discountVal + shipping;
              document.getElementById("total-display").textContent =
                formatVnd(total);
              showToastSafe("Áp dụng mã thành công!", "success");
            } else {
              msgEl.innerHTML =
                '<span style="color:red">❌ ' +
                (data.message || "Mã không hợp lệ") +
                "</span>";
              showToastSafe(data.message || "Mã không hợp lệ", "error");
            }
          } catch (err) {
            showToastSafe("Lỗi khi kiểm tra mã", "error");
          }
        };

        loadCart();
      </script>
    </main>
  </body>
</html>
