<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng — ĐiệnMáy Pro</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="section-title mb-3">Giỏ hàng <span>của bạn</span></div>
        <button
          class="btn btn-sm btn-outline-danger"
          id="clear-all-btn"
          onclick="clearCart()"
          style="display: none; margin-bottom: 1rem"
        >
          Xóa toàn bộ giỏ
        </button>
      </div>

      <div class="admin-card p-4 text-center" id="cart-placeholder">
        <p class="mb-0" id="placeholder-message">
          Trang giỏ hàng đã được tạo khung. Kết nối dữ liệu cart ở bước tiếp
          theo.
        </p>
      </div>

      <div class="row g-4" id="cart-data-container" style="display: none">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-0" id="cart-items-list"></div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card border-0 shadow-sm p-4 bg-light rounded-3">
            <h5 class="fw-bold mb-3">Tóm tắt đơn hàng</h5>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Tạm tính:</span>
              <span class="fw-semibold" id="subtotal-val">0đ</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-muted">Phí vận chuyển:</span>
              <span class="text-success fw-semibold">Miễn phí</span>
            </div>
            <hr />
            <div class="d-flex justify-content-between align-items-center mb-4">
              <span class="fw-bold fs-5">Tổng tiền:</span>
              <span class="fw-bold fs-4 text-danger" id="total-val">0đ</span>
            </div>
            <a
              class="btn btn-primary w-100 py-2.5 fw-bold rounded-2"
              th:href="@{/checkout}"
            >
              TIẾN HÀNH THANH TOÁN
            </a>
          </div>
        </div>
      </div>

      <script>
        const token = localStorage.getItem("firebase_token");

        document.addEventListener("DOMContentLoaded", () => {
          if (!token) {
            document.getElementById("placeholder-message").innerText =
              "Vui lòng đăng nhập để xem giỏ hàng của bạn.";
            return;
          }
          fetchCartData();
        });

        async function fetchCartData() {
          try {
            document.getElementById("placeholder-message").innerText =
              "Đang kết nối và tải dữ liệu giỏ hàng...";
            const response = await fetch("/api/cart", {
              method: "GET",
              headers: { Authorization: "Bearer " + token },
            });
            if (response.ok) {
              const data = await response.json();
              renderCartView(data);
            } else {
              document.getElementById("placeholder-message").innerText =
                "Không thể tải giỏ hàng từ máy chủ.";
            }
          } catch (error) {
            console.error(error);
            document.getElementById("placeholder-message").innerText =
              "Lỗi kết nối mạng, vui lòng tải lại trang.";
          }
        }

        function renderCartView(items) {
          const placeholder = document.getElementById("cart-placeholder");
          const container = document.getElementById("cart-data-container");
          const itemsList = document.getElementById("cart-items-list");
          const clearBtn = document.getElementById("clear-all-btn");

          if (!items || items.length === 0) {
            placeholder.style.display = "block";
            document.getElementById("placeholder-message").innerText =
              "Giỏ hàng của bạn đang trống!";
            container.style.display = "none";
            clearBtn.style.display = "none";
            return;
          }

          placeholder.style.display = "none";
          container.style.display = "flex";
          clearBtn.style.display = "block";
          itemsList.innerHTML = "";

          let cartSubtotal = 0;
          items.forEach((item) => {
            const basePrice =
              item.salePrice != null ? item.salePrice : item.originalPrice;
            const rowTotal = basePrice * item.quantity;
            cartSubtotal += rowTotal;

            const itemHtml = `
                    <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
                        <div class="d-flex align-items-center gap-3">
                            <div style="width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; background: #fafafa; border-radius: 6px;">
                                ${item.productThumbnailUrl || item.thumbnailUrl ? `<img src="${item.productThumbnailUrl || item.thumbnailUrl}" style="max-width:100%; max-height:100%;">` : `<span style="font-size:24px;">📱</span>`}
                            </div>
                            <div>
                                <h6 class="mb-0 fw-bold text-dark">${item.productName || "Sản phẩm công nghệ"}</h6>
                                <small class="text-danger fw-semibold">${formatMoney(basePrice)}đ</small>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <div class="input-group input-group-sm" style="width: 100px;">
                                <button class="btn btn-outline-secondary" onclick="updateItemQuantity(${item.id}, ${item.quantity - 1})">-</button>
                                <input type="text" class="form-control text-center bg-white" value="${item.quantity}" readonly>
                                <button class="btn btn-outline-secondary" onclick="updateItemQuantity(${item.id}, ${item.quantity + 1})">+</button>
                            </div>
                            <span class="fw-bold text-dark text-end" style="min-width: 90px;">${formatMoney(rowTotal)}đ</span>
                            <button class="btn btn-sm btn-link text-muted" onclick="deleteCartItem(${item.id})">
                                <i class="bi bi-trash3-fill text-danger fs-6"></i>
                            </button>
                        </div>
                    </div>
                `;
            itemsList.insertAdjacentHTML("beforeend", itemHtml);
          });

          document.getElementById("subtotal-val").innerText =
            formatMoney(cartSubtotal) + "đ";
          document.getElementById("total-val").innerText =
            formatMoney(cartSubtotal) + "đ";
        }

        async function updateItemQuantity(cartItemId, qty) {
          if (qty < 1) {
            deleteCartItem(cartItemId);
            return;
          }
          try {
            await fetch(`/api/cart/${cartItemId}`, {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + token,
              },
              body: JSON.stringify({ quantity: qty }),
            });
            fetchCartData();
          } catch (e) {
            console.error(e);
          }
        }

        async function deleteCartItem(cartItemId) {
          if (!confirm("Bạn muốn bỏ mặt hàng này khỏi giỏ?")) return;
          try {
            await fetch(`/api/cart/${cartItemId}`, {
              method: "DELETE",
              headers: { Authorization: "Bearer " + token },
            });
            fetchCartData();
          } catch (e) {
            console.error(e);
          }
        }

        async function clearCart() {
          if (
            !confirm("Xác nhận xóa toàn bộ sản phẩm trong giỏ hàng hiện tại?")
          )
            return;
          try {
            await fetch("/api/cart", {
              method: "DELETE",
              headers: { Authorization: "Bearer " + token },
            });
            fetchCartData();
          } catch (e) {
            console.error(e);
          }
        }

        function formatMoney(n) {
          return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
      </script>
    </main>
  </body>
</html>
