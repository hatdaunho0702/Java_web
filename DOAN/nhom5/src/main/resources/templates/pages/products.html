<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"

>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <div class="section-title">Tất cả <span>sản phẩm</span></div>
          <div class="text-muted">
            Có <strong th:text="${products.totalElements}">0</strong> sản phẩm
          </div>
        </div>
        <a th:href="@{/products}" class="btn btn-outline-secondary">Bỏ lọc</a>
      </div>
      <div class="row g-3">
        <div class="col-lg-3">
          <div class="admin-card p-3 h-100">
            <h6 class="fw-bold mb-3">Bộ lọc</h6>
            <div class="small text-muted mb-2">Danh mục</div>
            <div class="list-group list-group-flush mb-3">
              <a
                th:each="cat : ${categories}"
                th:href="@{/products(categoryId=${cat.id})}"
                class="list-group-item list-group-item-action border-0 px-0"
                th:text="${cat.name}"
                >Danh mục</a
              >
            </div>
            <div class="small text-muted mb-2">Thương hiệu</div>
            <div class="list-group list-group-flush">
              <a
                th:each="brand : ${brands}"
                th:href="@{/products(brandId=${brand.id})}"
                class="list-group-item list-group-item-action border-0 px-0"
                th:text="${brand.name}"
                >Thương hiệu</a
              >
            </div>
          </div>
        </div>
        <div class="col-lg-9">
          <div class="row g-3">
            <div class="col-6 col-md-4" th:each="p : ${products.content}">
              <div class="product-card">
                <div class="product-img-wrapper">
                  <img
                    th:if="${p.thumbnailUrl != null}"
                    th:src="@{${p.thumbnailUrl}}"
                    th:alt="${p.name}"
                  />
                  <div
                    th:unless="${p.thumbnailUrl != null}"
                    style="font-size: 54px"
                  >
                    📦
                  </div>
                </div>
                <div class="product-body">
                  <div class="product-brand">Sản phẩm</div>
                  <div class="product-name" th:text="${p.name}">Tên</div>
                  <div class="product-rating">
                    ★★★★★ <span th:text="${p.avgRating}"></span>
                  </div>
                  <div
                    th:if="${p.salePrice != null}"
                    class="price-sale"
                    th:text="${#numbers.formatDecimal(p.salePrice,0,'COMMA',0,'POINT') + 'đ'}"
                  ></div>
                  <div
                    th:unless="${p.salePrice != null}"
                    class="price-normal"
                    th:text="${#numbers.formatDecimal(p.originalPrice,0,'COMMA',0,'POINT') + 'đ'}"
                  ></div>
                  <a
                    th:href="@{/products/{slug}(slug=${p.slug})}"
                    class="btn-add-cart mt-2"
                    >Xem chi tiết</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
