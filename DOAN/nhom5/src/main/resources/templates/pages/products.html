<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main class="container pb-5">
      <!-- Dynamic Breadcrumbs -->
      <div class="py-3">
        <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
          <ol class="breadcrumb mb-0 cyber-breadcrumb">
            <li class="breadcrumb-item cyber-breadcrumb-item"><a href="/">Home</a></li>
            <li class="breadcrumb-item cyber-breadcrumb-item"><a href="/products">Catalog</a></li>
            <li class="breadcrumb-item active fw-bold text-black" aria-current="page" id="catalog-breadcrumb-active">Smartphones</li>
          </ol>
        </nav>
      </div>

      <!-- Selected Count & Sort Dropdown -->
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div class="selected-products-title">
          Selected Products: <strong id="total-products">0</strong>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-sm btn-outline-dark d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#mobileFilterSheet">
            <i class="bi bi-funnel"></i> Filters
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="clearFiltersBtn">Clear Filters</button>
          <select id="sortSelect" class="cyber-sort-select">
            <option value="popular">By rating</option>
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
          </select>
        </div>
      </div>

      <div class="row g-4">
        <!-- Desktop Filters Sidebar Column -->
        <div class="col-lg-3 d-none d-lg-block reveal-on-scroll" data-delay-index="0">
          <div id="desktopFilterPanel" class="pe-lg-3">
            
            <!-- Category Filter Accordion (Renders dynamically) -->
            <div class="filter-accordion">
              <div class="filter-accordion-header" onclick="toggleAccordion(this)">
                <span>Category</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content" id="desktopCategories">
                <!-- Loaded dynamically -->
              </div>
            </div>

            <!-- Brand Filter Accordion (Renders dynamically) -->
            <div class="filter-accordion">
              <div class="filter-accordion-header" onclick="toggleAccordion(this)">
                <span>Brand</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <div class="brand-search-wrapper">
                  <i class="bi bi-search"></i>
                  <input type="text" class="brand-search-input" id="desktopBrandSearch" placeholder="Search Brand..." />
                </div>
                <div id="desktopBrands">
                  <!-- Loaded dynamically -->
                </div>
              </div>
            </div>
            
            <!-- Battery Capacity Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Battery capacity</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>4000 mAh - 4500 mAh</span>
                  <span class="filter-checkbox-count">12</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>4500 mAh - 5000 mAh</span>
                  <span class="filter-checkbox-count">48</span>
                </label>
              </div>
            </div>

            <!-- Screen Type Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Screen type</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>OLED</span>
                  <span class="filter-checkbox-count">34</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>AMOLED</span>
                  <span class="filter-checkbox-count">25</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>IPS LCD</span>
                  <span class="filter-checkbox-count">18</span>
                </label>
              </div>
            </div>

            <!-- Screen Diagonal Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Screen diagonal</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>6.1" - 6.5"</span>
                  <span class="filter-checkbox-count">29</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>6.5" - 6.9"</span>
                  <span class="filter-checkbox-count">56</span>
                </label>
              </div>
            </div>

            <!-- Protection Class Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Protection class</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>IP68</span>
                  <span class="filter-checkbox-count">40</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>IP67</span>
                  <span class="filter-checkbox-count">15</span>
                </label>
              </div>
            </div>

            <!-- Built-in Memory Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Built-in memory</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>128 GB</span>
                  <span class="filter-checkbox-count">52</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>256 GB</span>
                  <span class="filter-checkbox-count">64</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>512 GB</span>
                  <span class="filter-checkbox-count">28</span>
                </label>
                <label class="filter-checkbox-label">
                  <input type="checkbox" disabled />
                  <span>1 TB</span>
                  <span class="filter-checkbox-count">10</span>
                </label>
              </div>
            </div>

            <!-- Price Accordion -->
            <div class="filter-accordion">
              <div class="filter-accordion-header collapsed" onclick="toggleAccordion(this)">
                <span>Price Range (VND)</span>
                <i class="bi bi-chevron-up"></i>
              </div>
              <div class="filter-accordion-content">
                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <input id="minPriceInput" type="number" class="form-control form-control-sm" placeholder="From" min="0" />
                  </div>
                  <div class="col-6">
                    <input id="maxPriceInput" type="number" class="form-control form-control-sm" placeholder="To" min="0" />
                  </div>
                </div>
                <div class="d-grid gap-2">
                  <button id="applyFiltersDesktop" class="btn btn-dark btn-sm">Apply Price</button>
                  <button id="resetFiltersDesktop" class="btn btn-outline-secondary btn-sm">Reset</button>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- Product Cards Grid Column -->
        <div class="col-lg-9">
          <div class="row g-4" id="productsGrid"></div>

          <div class="p-5 text-center bg-light rounded-4 my-3" id="emptyProducts" style="display: none">
            <i class="bi bi-search" style="font-size: 40px; color: #cbd5e1;"></i>
            <div class="mt-2 text-muted fw-semibold">No products found matching the criteria.</div>
            <button class="btn btn-sm btn-dark mt-3" id="resetAllFiltersBtn">Reset Filters</button>
          </div>

          <nav class="mt-5" aria-label="Pagination">
            <ul class="pagination justify-content-center" id="pagination"></ul>
          </nav>
        </div>
      </div>

      <!-- Mobile Filter Sheet -->
      <div class="offcanvas offcanvas-bottom" tabindex="-1" id="mobileFilterSheet" style="height: 80vh">
        <div class="offcanvas-header border-bottom">
          <h5 class="offcanvas-title fw-bold" style="font-family: 'Sora', sans-serif;">Filters</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <div class="fw-semibold mb-2" style="font-family: 'Sora', sans-serif;">Category</div>
          <div id="mobileCategories" class="mb-3"></div>

          <div class="fw-semibold mb-2" style="font-family: 'Sora', sans-serif;">Brand</div>
          <div id="mobileBrands" class="mb-3"></div>

          <div class="fw-semibold mb-2" style="font-family: 'Sora', sans-serif;">Price Range (VND)</div>
          <div class="row g-2 mb-3">
            <div class="col-6"><input id="mobileMinPrice" type="number" class="form-control" placeholder="From" min="0" /></div>
            <div class="col-6"><input id="mobileMaxPrice" type="number" class="form-control" placeholder="To" min="0" /></div>
          </div>

          <div class="d-grid gap-2">
            <button id="applyFiltersMobile" class="btn btn-dark">Apply Filters</button>
            <button id="resetFiltersMobile" class="btn btn-outline-secondary">Reset All</button>
          </div>
        </div>
      </div>

      <!-- Quick View Modal (Preserved Functionality) -->
      <div class="modal fade" id="quickViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0">
              <h5 class="modal-title fw-bold" style="font-family: 'Sora', sans-serif;">Quick View</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="quickViewContent"></div>
          </div>
        </div>
      </div>

      <!-- Logic Script -->
      <script type="module">
        const state = {
          keyword: "",
          categoryIds: [],
          brandIds: [],
          minPrice: "",
          maxPrice: "",
          sort: "popular",
          page: 0,
          size: 12,
          categories: [],
          brands: [],
          priceRange: { min: 0, max: 100000000 },
          productMap: new Map(),
        };

        function formatVND(v) {
          return Number(v || 0).toLocaleString("vi-VN") + "đ";
        }

        // Accordion Toggle
        window.toggleAccordion = function(header) {
          header.classList.toggle("collapsed");
        };

        // Wishlist functionality
        window.toggleWishlist = function(productId, btnEl) {
          let wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const idx = wishlist.indexOf(productId);
          const icon = btnEl.querySelector("i");
          if (idx > -1) {
            wishlist.splice(idx, 1);
            icon.className = "bi bi-heart text-muted";
            if (typeof window.showToast === "function") {
              window.showToast("Đã xóa khỏi danh sách yêu thích", "info");
            }
          } else {
            wishlist.push(productId);
            icon.className = "bi bi-heart-fill text-danger";
            if (typeof window.showToast === "function") {
              window.showToast("Đã thêm vào danh sách yêu thích", "success");
            }
          }
          localStorage.setItem("wishlist", JSON.stringify(wishlist));
          updateWishlistCount();
        };

        function updateWishlistCount() {
          const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const badge = document.querySelector(".nav-link-cyber i.bi-heart");
          if (badge) {
            let badgeEl = badge.parentElement.querySelector(".wishlist-badge");
            if (!badgeEl) {
              badgeEl = document.createElement("span");
              badgeEl.className = "wishlist-badge";
              badgeEl.style = "position: absolute; top: -4px; right: -6px; background: #000000; color: #fff; border-radius: 999px; font-size: 9px; font-weight: 800; min-width: 14px; height: 14px; padding: 0 3px; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid #fff;";
              badge.parentElement.appendChild(badgeEl);
              badge.parentElement.style.position = "relative";
            }
            badgeEl.textContent = wishlist.length;
            badgeEl.style.display = wishlist.length > 0 ? "inline-flex" : "none";
          }
        }

        function parseQueryState() {
          const params = new URLSearchParams(window.location.search);
          state.keyword = params.get("keyword") || "";
          state.categoryIds = params.getAll("categoryId").map(Number).filter(Boolean);
          state.brandIds = params.getAll("brandId").map(Number).filter(Boolean);
          state.minPrice = params.get("minPrice") || "";
          state.maxPrice = params.get("maxPrice") || "";
          state.sort = params.get("sort") || "popular";
          state.page = Math.max(0, Number(params.get("page") || 0));
          state.size = Math.max(1, Number(params.get("size") || 12));
        }

        function syncQuery() {
          const params = new URLSearchParams();
          if (state.keyword) params.set("keyword", state.keyword);
          state.categoryIds.forEach((id) => params.append("categoryId", String(id)));
          state.brandIds.forEach((id) => params.append("brandId", String(id)));
          if (state.minPrice) params.set("minPrice", state.minPrice);
          if (state.maxPrice) params.set("maxPrice", state.maxPrice);
          if (state.sort) params.set("sort", state.sort);
          params.set("page", String(state.page));
          params.set("size", String(state.size));
          history.pushState({}, "", "?" + params.toString());
        }

        function productCard(product, index = 0) {
          const sale = Number(product.salePrice || 0);
          const original = Number(product.originalPrice || 0);
          const display = sale || original;
          const stock = Number(product.stockQty || 0);
          const disabled = stock <= 0;
          
          const wishlist = JSON.parse(localStorage.getItem("wishlist") || "[]");
          const isWishlisted = wishlist.includes(product.id);
          const heartIconClass = isWishlisted ? "bi-heart-fill text-danger" : "bi-heart text-muted";

          return `
            <div class="col-6 col-md-6 col-lg-4 reveal-on-scroll" data-delay-index="${index % 3}">
              <div class="cyber-product-card" data-product-id="${product.id}">
                <button class="wishlist-btn" onclick="event.stopPropagation(); toggleWishlist(${product.id}, this)">
                  <i class="bi ${heartIconClass}"></i>
                </button>
                <div class="cyber-product-img-wrapper" style="cursor: pointer" onclick="location.href='/products/${product.slug}'">
                  ${product.thumbnailUrl
                    ? `<img class="cyber-product-img" src="${product.thumbnailUrl}" alt="${product.name}">`
                    : `<div style="font-size:54px">📦</div>`}
                </div>
                <div>
                  <div class="cyber-product-title" style="cursor: pointer" onclick="location.href='/products/${product.slug}'">${product.name}</div>
                  <div class="cyber-product-price">${formatVND(display)}</div>
                </div>
                <button class="btn-buy-now btn-add-cart" data-product-id="${product.id}" ${disabled ? "disabled" : ""}>
                  ${disabled ? "Hết hàng" : "Buy Now"}
                </button>
              </div>
            </div>`;
        }

        function renderCheckboxList(containerId, items, type, selected) {
          const container = document.getElementById(containerId);
          if (!container) return;
          container.innerHTML = items.map((item) => {
            // Deterministic mock brand counts like: Apple (110), Samsung (125), Xiaomi (68)
            const count = Math.floor((item.id * 17) % 85) + 15;
            return `
              <label class="filter-checkbox-label" data-name="${item.name.toLowerCase()}">
                <input type="checkbox" data-type="${type}" value="${item.id}" ${selected.includes(item.id) ? "checked" : ""} onchange="triggerFilterChange()">
                <span>${item.name}</span>
                <span class="filter-checkbox-count">${count}</span>
              </label>
            `;
          }).join("");
        }

        window.triggerFilterChange = function() {
          applyDesktopFilters();
        };

        function renderProducts(items) {
          const grid = document.getElementById("productsGrid");
          const empty = document.getElementById("emptyProducts");
          state.productMap = new Map(items.map((it) => [it.id, it]));
          if (!items.length) {
            grid.innerHTML = "";
            empty.style.display = "block";
            return;
          }
          empty.style.display = "none";
          grid.innerHTML = items.map((p, idx) => productCard(p, idx)).join("");
          if (typeof window.initScrollReveal === "function") {
            window.initScrollReveal();
          }
        }

        function renderPagination(data) {
          const pagination = document.getElementById("pagination");
          const totalPages = Number(data.totalPages || 0);
          const currentPage = Number(data.currentPage || 0);
          if (totalPages <= 1) {
            pagination.innerHTML = "";
            return;
          }

          const items = [];
          items.push(`<li class="page-item ${currentPage === 0 ? "disabled" : ""}"><button class="page-link" data-page="${Math.max(0, currentPage - 1)}">Trước</button></li>`);

          const start = Math.max(0, currentPage - 2);
          const end = Math.min(totalPages - 1, currentPage + 2);
          for (let p = start; p <= end; p++) {
            items.push(`<li class="page-item ${p === currentPage ? "active" : ""}"><button class="page-link" data-page="${p}">${p + 1}</button></li>`);
          }

          items.push(`<li class="page-item ${currentPage >= totalPages - 1 ? "disabled" : ""}"><button class="page-link" data-page="${Math.min(totalPages - 1, currentPage + 1)}">Sau</button></li>`);
          pagination.innerHTML = items.join("");
        }

        function bindFilterInputs() {
          document.getElementById("sortSelect").value = state.sort;
          document.getElementById("minPriceInput").value = state.minPrice;
          document.getElementById("maxPriceInput").value = state.maxPrice;
          document.getElementById("mobileMinPrice").value = state.minPrice;
          document.getElementById("mobileMaxPrice").value = state.maxPrice;
        }

        function collectChecked(selector) {
          return Array.from(document.querySelectorAll(selector + ":checked"))
            .map((el) => Number(el.value))
            .filter(Boolean);
        }

        function applyDesktopFilters() {
          state.sort = document.getElementById("sortSelect").value || "popular";
          state.minPrice = document.getElementById("minPriceInput").value.trim();
          state.maxPrice = document.getElementById("maxPriceInput").value.trim();
          state.categoryIds = collectChecked('#desktopCategories input[data-type="category"]');
          state.brandIds = collectChecked('#desktopBrands input[data-type="brand"]');
          state.page = 0;
          filterProducts();
        }

        function applyMobileFilters() {
          state.sort = document.getElementById("sortSelect").value || "popular";
          state.minPrice = document.getElementById("mobileMinPrice").value.trim();
          state.maxPrice = document.getElementById("mobileMaxPrice").value.trim();
          state.categoryIds = collectChecked('#mobileCategories input[data-type="category"]');
          state.brandIds = collectChecked('#mobileBrands input[data-type="brand"]');
          state.page = 0;
          filterProducts();
          bootstrap.Offcanvas.getOrCreateInstance(document.getElementById("mobileFilterSheet")).hide();
        }

        function resetFilters() {
          state.keyword = "";
          state.categoryIds = [];
          state.brandIds = [];
          state.minPrice = "";
          state.maxPrice = "";
          state.sort = "popular";
          state.page = 0;
          bindFilterInputs();
          renderCheckboxList("desktopCategories", state.categories, "category", state.categoryIds);
          renderCheckboxList("desktopBrands", state.brands, "brand", state.brandIds);
          renderCheckboxList("mobileCategories", state.categories, "category", state.categoryIds);
          renderCheckboxList("mobileBrands", state.brands, "brand", state.brandIds);
          filterProducts();
        }

        function updateBreadcrumbsText() {
          const activeCrumb = document.getElementById("catalog-breadcrumb-active");
          if (!activeCrumb) return;
          const checkedCats = document.querySelectorAll('#desktopCategories input[data-type="category"]:checked');
          if (checkedCats.length === 1) {
            const catName = checkedCats[0].closest(".filter-checkbox-label").querySelector("span").textContent;
            activeCrumb.textContent = catName;
          } else {
            activeCrumb.textContent = "Smartphones";
          }
        }

        async function filterProducts() {
          const url = new URL("/api/products", window.location.origin);
          if (state.keyword) url.searchParams.set("keyword", state.keyword);
          state.categoryIds.forEach((id) => url.searchParams.append("categoryId", String(id)));
          state.brandIds.forEach((id) => url.searchParams.append("brandId", String(id)));
          if (state.minPrice) url.searchParams.set("minPrice", state.minPrice);
          if (state.maxPrice) url.searchParams.set("maxPrice", state.maxPrice);
          url.searchParams.set("sort", state.sort);
          url.searchParams.set("page", String(state.page));
          url.searchParams.set("size", String(state.size));

          const res = await fetch(url);
          if (!res.ok) {
            if (typeof window.showToast === "function") {
              window.showToast("Không tải được danh sách sản phẩm", "error");
            }
            return;
          }

          const data = await res.json();
          state.categories = data.filters?.categories || state.categories;
          state.brands = data.filters?.brands || state.brands;
          state.priceRange = data.filters?.priceRange || state.priceRange;

          renderCheckboxList("desktopCategories", state.categories, "category", state.categoryIds);
          renderCheckboxList("desktopBrands", state.brands, "brand", state.brandIds);
          renderCheckboxList("mobileCategories", state.categories, "category", state.categoryIds);
          renderCheckboxList("mobileBrands", state.brands, "brand", state.brandIds);

          document.getElementById("total-products").textContent = String(data.totalElements || 0);
          renderProducts(data.content || []);
          renderPagination(data);
          updateBreadcrumbsText();
          syncQuery();
        }

        function openQuickView(productId) {
          const p = state.productMap.get(productId);
          if (!p) return;
          const stock = Number(p.stockQty || 0);
          const displayPrice = p.salePrice || p.originalPrice;
          document.getElementById("quickViewContent").innerHTML = `
            <div class="row g-3">
              <div class="col-md-5 text-center">
                ${p.thumbnailUrl
                  ? `<img src="${p.thumbnailUrl}" alt="${p.name}" style="width:100%;max-height:280px;object-fit:cover;border-radius:10px">`
                  : `<div style="height:280px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:10px;font-size:64px">📦</div>`}
              </div>
              <div class="col-md-7">
                <h5 class="fw-bold">${p.name}</h5>
                <div class="mb-2">
                  ${p.salePrice ? `<span class="price-original">${formatVND(p.originalPrice)}</span>` : ""}
                  <div class="${p.salePrice ? "price-sale" : "price-normal"}">${formatVND(displayPrice)}</div>
                </div>
                <div class="mb-3">Tồn kho: <strong>${stock}</strong></div>
                <div class="d-flex gap-2">
                  <button class="btn btn-dark" id="qvAddCart" ${stock <= 0 ? "disabled" : ""}>${stock <= 0 ? "Hết hàng" : "🛒 Thêm vào giỏ"}</button>
                  <a href="/products/${p.slug}" class="btn btn-outline-secondary">Xem chi tiết</a>
                </div>
              </div>
            </div>`;

          const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById("quickViewModal"));
          modal.show();
          const addBtn = document.getElementById("qvAddCart");
          if (addBtn && stock > 0) {
            addBtn.addEventListener("click", () => {
              if (typeof window.addToCart === "function") {
                window.addToCart(p.id);
              }
            });
          }
        }

        // Live Brand Search Box event listener
        const brandSearchInput = document.getElementById("desktopBrandSearch");
        if (brandSearchInput) {
          brandSearchInput.addEventListener("keyup", (e) => {
            const query = e.target.value.toLowerCase().trim();
            const labels = document.querySelectorAll("#desktopBrands .filter-checkbox-label");
            labels.forEach(lbl => {
              const name = lbl.dataset.name || "";
              if (name.includes(query)) {
                lbl.style.setProperty("display", "flex", "important");
              } else {
                lbl.style.setProperty("display", "none", "important");
              }
            });
          });
        }

        document.getElementById("applyFiltersDesktop").addEventListener("click", applyDesktopFilters);
        document.getElementById("applyFiltersMobile").addEventListener("click", applyMobileFilters);
        document.getElementById("resetFiltersDesktop").addEventListener("click", resetFilters);
        document.getElementById("resetFiltersMobile").addEventListener("click", resetFilters);
        document.getElementById("clearFiltersBtn").addEventListener("click", resetFilters);
        document.getElementById("resetAllFiltersBtn").addEventListener("click", resetFilters);
        document.getElementById("sortSelect").addEventListener("change", () => {
          state.sort = document.getElementById("sortSelect").value;
          state.page = 0;
          filterProducts();
        });

        document.addEventListener("click", (e) => {
          const addBtn = e.target.closest(".btn-add-cart[data-product-id]");
          if (addBtn) {
            const id = Number(addBtn.dataset.productId);
            if (typeof window.addToCart === "function") {
              window.addToCart(id);
            }
            return;
          }

          const pageBtn = e.target.closest("#pagination .page-link[data-page]");
          if (pageBtn && !pageBtn.closest(".disabled") && !pageBtn.closest(".active")) {
            state.page = Number(pageBtn.dataset.page || 0);
            filterProducts();
          }
        });

        window.addEventListener("popstate", () => {
          parseQueryState();
          bindFilterInputs();
          filterProducts();
        });

        // Initialize state
        parseQueryState();
        bindFilterInputs();
        await filterProducts();
        updateWishlistCount();
      </script>
    </main>
  </body>
</html>
