<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/base :: layout(~{::title}, ~{::main})}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang chủ — ĐiệnMáy Pro</title>
  </head>
  <body>
    <main>
      <section class="hero-section" id="hero-slider">
        <div class="container">
          <div class="hero-floating-card" style="padding: 0; overflow: hidden">
            <div class="row g-0 align-items-stretch" id="hero-content"></div>
            <div
              class="d-flex justify-content-center gap-2 py-3"
              id="hero-dots"
            ></div>
          </div>
        </div>
      </section>

      <section class="py-5">
        <div class="container">
          <div class="section-title">Danh mục <span>nổi bật</span></div>
          <div class="section-divider"></div>
          <div class="row g-3" id="featured-categories"></div>
        </div>
      </section>

      <section class="pb-5">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title">Sản phẩm <span>mới về</span></div>
            <a
              th:href="@{/products(sort=newest)}"
              style="color: var(--accent); font-weight: 600"
              >Xem tất cả →</a
            >
          </div>
          <div class="section-divider"></div>
          <div class="row g-3" id="new-arrivals"></div>
        </div>
      </section>

      <section class="pb-5">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title">Đang <span>giảm giá</span></div>
            <a
              th:href="@{/products(sort=price_asc)}"
              style="color: var(--accent); font-weight: 600"
              >Săn deal →</a
            >
          </div>
          <div class="section-divider"></div>
          <div class="row g-3" id="on-sale"></div>
        </div>
      </section>

      <section class="pb-5">
        <div class="container">
          <div class="promo-banner">
            <span
              class="badge mb-2"
              style="
                background: rgba(255, 255, 255, 0.3);
                color: white;
                padding: 6px 14px;
              "
              >⚡ FLASH SALE</span
            >
            <h3>Siêu sale đến hết hôm nay<br />Giảm sâu toàn bộ ngành hàng</h3>
            <p>Mỗi ngày một deal sốc, số lượng có hạn</p>
            <div class="d-flex gap-3 my-3 flex-wrap" id="countdown">
              <div class="countdown-box">
                <div class="countdown-val" id="cd-hours">00</div>
                <div class="countdown-lbl">Giờ</div>
              </div>
              <div class="countdown-box">
                <div class="countdown-val" id="cd-mins">00</div>
                <div class="countdown-lbl">Phút</div>
              </div>
              <div class="countdown-box">
                <div class="countdown-val" id="cd-secs">00</div>
                <div class="countdown-lbl">Giây</div>
              </div>
            </div>
            <a th:href="@{/products(sort=popular)}" class="btn-promo"
              >Xem ngay →</a
            >
          </div>
        </div>
      </section>

      <section class="pb-5">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="section-title">Bán chạy <span>nhất</span></div>
            <a
              th:href="@{/products(sort=popular)}"
              style="color: var(--accent); font-weight: 600"
              >Top sản phẩm →</a
            >
          </div>
          <div class="section-divider"></div>
          <div class="row g-3" id="best-seller"></div>
        </div>
      </section>

      <script type="module">
        const HERO_SLIDES = [
          {
            badge: "🔥 Khai trương mùa hè",
            title: "Công nghệ mới\nGiá tốt mỗi ngày",
            desc: "Laptop, điện thoại, tivi chính hãng. Giao nhanh trong ngày tại nội thành.",
            cta1: { text: "Mua ngay", href: "/products" },
            cta2: { text: "Xem ưu đãi", href: "/products?sort=popular" },
            bg: "linear-gradient(120deg,#0f172a,#1d4ed8,#0ea5e9)",
            emoji: "💻 📱 📺",
          },
          {
            badge: "⚡ Flash Deal 24h",
            title: "Giảm sâu đến 50%\nSố lượng có hạn",
            desc: "Săn mã giảm giá, tích điểm thành viên và nhận ưu đãi độc quyền theo khung giờ.",
            cta1: { text: "Săn deal", href: "/products?sort=price_asc" },
            cta2: { text: "Hàng mới về", href: "/products?sort=newest" },
            bg: "linear-gradient(120deg,#7f1d1d,#ea580c,#f59e0b)",
            emoji: "🎧 ⌚ 🖥️",
          },
          {
            badge: "🚚 Miễn phí vận chuyển",
            title: "Đơn từ 500K\nGiao hàng toàn quốc",
            desc: "Đổi trả 7 ngày, bảo hành tận nơi, hỗ trợ kỹ thuật 24/7.",
            cta1: { text: "Khám phá", href: "/products" },
            cta2: { text: "Danh mục", href: "/products" },
            bg: "linear-gradient(120deg,#14532d,#0d9488,#0891b2)",
            emoji: "🧊 🧺 📦",
          },
        ];

        const iconPalette = [
          "#eef2ff",
          "#fef3c7",
          "#ecfeff",
          "#f0fdf4",
          "#fff1f2",
          "#f5f3ff",
        ];
        const iconGlyph = [
          "bi-phone",
          "bi-laptop",
          "bi-tv",
          "bi-speaker",
          "bi-watch",
          "bi-cpu",
        ];

        function formatVND(value) {
          return Number(value || 0).toLocaleString("vi-VN") + "đ";
        }

        function getDiscountPercent(product) {
          const original = Number(product.originalPrice || 0);
          const sale = Number(product.salePrice || 0);
          if (!original || !sale || sale >= original) {
            return 0;
          }
          return Math.round(((original - sale) / original) * 100);
        }

        function productCard(product, badgeType) {
          const price = Number(product.salePrice || product.originalPrice || 0);
          const hasSale = !!product.salePrice;
          const stock = Number(product.stockQty || 0);
          const disabled = stock <= 0;
          const salePercent = getDiscountPercent(product);
          let badge = '<span class="badge-sale">Mới</span>';
          if (disabled) {
            badge =
              '<span class="badge-sale" style="background:#64748b">Hết hàng</span>';
          } else if (badgeType === "sale" && salePercent > 0) {
            badge = `<span class=\"badge-sale\">-${salePercent}%</span>`;
          }

          return `
            <div class="col-6 col-md-4 col-lg-3">
              <div class="product-card" data-product-id="${product.id}">
                <div class="product-img-wrapper">
                  ${badge}
                  ${
                    product.thumbnailUrl
                      ? `<img src="${product.thumbnailUrl}" alt="${product.name}">`
                      : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:56px">📦</div>`
                  }
                  <button class="btn-quick-view" data-slug="${product.slug}">👁 Xem nhanh</button>
                </div>
                <div class="product-body">
                  <div class="product-name">${product.name}</div>
                  <div class="product-rating">★★★★★ <span>(${(product.avgRating || 0).toFixed(1)})</span></div>
                  <div class="mb-2">
                    ${hasSale ? `<span class=\"price-original\">${formatVND(product.originalPrice)}</span>` : ""}
                    <div class="${hasSale ? "price-sale" : "price-normal"}">${formatVND(price)}</div>
                    <small class="text-muted">Tồn kho: ${stock}</small>
                  </div>
                  <button class="btn-add-cart" data-product-id="${product.id}" ${disabled ? "disabled" : ""}>${disabled ? "Hết hàng" : "🛒 Thêm vào giỏ"}</button>
                </div>
              </div>
            </div>`;
        }

        function renderHero(index) {
          const slide = HERO_SLIDES[index];
          const hero = document.getElementById("hero-content");
          if (!hero) return;
          hero.innerHTML = `
            <div class="col-lg-8 p-4 p-lg-5" style="background:${slide.bg};color:white">
              <span class="badge rounded-pill" style="background:rgba(255,255,255,.2);padding:8px 16px">${slide.badge}</span>
              <h1 class="hero-title mt-3" style="white-space:pre-line">${slide.title}</h1>
              <p class="hero-subtitle">${slide.desc}</p>
              <div class="d-flex gap-3 flex-wrap mt-3">
                <a href="${slide.cta1.href}" class="btn-hero-primary">${slide.cta1.text}</a>
                <a href="${slide.cta2.href}" class="btn-hero-secondary">${slide.cta2.text}</a>
              </div>
            </div>
            <div class="col-lg-4 d-none d-lg-flex align-items-center justify-content-center" style="background:rgba(15,23,42,.07)">
              <div style="font-size:52px">${slide.emoji}</div>
            </div>
          `;

          const dots = document.getElementById("hero-dots");
          if (dots) {
            dots.innerHTML = HERO_SLIDES.map(
              (_, i) => `
              <button type="button" data-idx="${i}" style="width:10px;height:10px;border-radius:999px;border:none;${i === index ? "background:var(--accent)" : "background:#cbd5e1"}"></button>
            `,
            ).join("");
          }
        }

        async function loadFeatured() {
          try {
            const res = await fetch("/api/products/featured");
            if (!res.ok) {
              throw new Error("Không thể tải dữ liệu trang chủ");
            }
            const data = await res.json();

            const catEl = document.getElementById("featured-categories");
            catEl.innerHTML = (data.categories || [])
              .map(
                (cat, idx) => `
              <div class="col-6 col-md-4 col-lg-2">
                <a href="/products?categoryId=${cat.id}" class="cat-card">
                  <div class="cat-icon" style="background:${iconPalette[idx % iconPalette.length]}">
                    <i class="bi ${iconGlyph[idx % iconGlyph.length]}" style="color:#1d4ed8"></i>
                  </div>
                  <div style="font-size:14px;font-weight:600">${cat.name}</div>
                </a>
              </div>
            `,
              )
              .join("");

            document.getElementById("new-arrivals").innerHTML = (
              data.newArrivals || []
            )
              .map((p) => productCard(p, "new"))
              .join("");
            document.getElementById("on-sale").innerHTML = (data.onSale || [])
              .map((p) => productCard(p, "sale"))
              .join("");
            document.getElementById("best-seller").innerHTML = (
              data.bestSeller || []
            )
              .map((p) => productCard(p, "best"))
              .join("");
          } catch (e) {
            if (typeof window.showToast === "function") {
              window.showToast(e.message || "Lỗi tải dữ liệu", "error");
            }
          }
        }

        function startDailyCountdown() {
          const tick = () => {
            const end = new Date();
            end.setHours(23, 59, 59, 999);
            const diff = Math.max(0, end.getTime() - Date.now());
            const hours = Math.floor(diff / 3600000);
            const mins = Math.floor((diff % 3600000) / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            const h = document.getElementById("cd-hours");
            const m = document.getElementById("cd-mins");
            const s = document.getElementById("cd-secs");
            if (h) h.textContent = String(hours).padStart(2, "0");
            if (m) m.textContent = String(mins).padStart(2, "0");
            if (s) s.textContent = String(secs).padStart(2, "0");
          };
          tick();
          setInterval(tick, 1000);
        }

        let heroIndex = 0;
        renderHero(heroIndex);
        setInterval(() => {
          heroIndex = (heroIndex + 1) % HERO_SLIDES.length;
          renderHero(heroIndex);
        }, 4500);

        document.addEventListener("click", (event) => {
          const dot = event.target.closest("#hero-dots button");
          if (dot) {
            heroIndex = Number(dot.dataset.idx || 0);
            renderHero(heroIndex);
          }
        });

        await loadFeatured();
        startDailyCountdown();
      </script>
    </main>
  </body>
</html>
