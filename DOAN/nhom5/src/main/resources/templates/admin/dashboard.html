<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/admin-base :: layout(~{::title}, ~{::div.page-content})}"

>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Admin</title>
  </head>
  <body>
    <div class="page-content">
      <div class="row g-4 mb-4">
        <div class="col-6 col-xl-3">
          <div class="stat-card stat-card-1" data-icon="💰">
            <div class="stat-label">Doanh thu hôm nay</div>
            <div
              class="stat-value"
              th:text="${#numbers.formatDecimal(todayRevenue,0,'COMMA',0,'POINT') + 'đ'}"
            >
              0đ
            </div>
            <div class="stat-change">↑ so với hôm qua</div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card stat-card-2" data-icon="📦">
            <div class="stat-label">Đơn hàng tháng này</div>
            <div
              class="stat-value"
              th:text="${monthlyRevenue != null ? #numbers.formatDecimal(monthlyRevenue,0,'COMMA',0,'POINT') + 'đ' : '0đ'}"
            >
              0đ
            </div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card stat-card-3" data-icon="👥">
            <div class="stat-label">Tổng khách hàng</div>
            <div class="stat-value">...</div>
          </div>
        </div>
        <div class="col-6 col-xl-3">
          <div class="stat-card stat-card-4" data-icon="🛍️">
            <div class="stat-label">Sản phẩm đang bán</div>
            <div class="stat-value" th:text="${topProducts.size()}">0</div>
          </div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="admin-card">
            <div class="admin-card-header">📈 Doanh thu 7 ngày gần nhất</div>
            <div class="p-4">
              <canvas id="revenueChart" height="100"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="admin-card">
            <div class="admin-card-header">📊 Đơn hàng theo trạng thái</div>
            <div class="p-4">
              <canvas id="statusChart"></canvas>
              <div class="mt-3">
                <div
                  th:each="entry : ${ordersByStatus}"
                  class="d-flex justify-content-between mb-2"
                >
                  <span
                    th:class="'badge-status badge-' + ${entry.key}"
                    th:text="${entry.key}"
                  ></span
                  ><strong th:text="${entry.value}"></strong>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="admin-card">
            <div class="admin-card-header">🏆 Top sản phẩm bán chạy</div>
            <table class="table admin-table mb-0">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Sản phẩm</th>
                  <th>Đã bán</th>
                  <th>Giá</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p,iter : ${topProducts}">
                  <td th:text="${iter.index + 1}"></td>
                  <td th:text="${p.name}"></td>
                  <td>
                    <span
                      class="badge bg-primary"
                      th:text="${p.stockQty}"
                    ></span>
                  </td>
                  <td
                    th:text="${#numbers.formatDecimal(p.originalPrice,0,'COMMA',0,'POINT') + 'đ'}"
                  ></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="admin-card">
            <div class="admin-card-header">
              ⚠️ Sắp hết hàng
              <span
                class="badge"
                style="background: var(--gradient-pink); color: white"
                th:text="${lowStockProducts.size()}"
              ></span>
            </div>
            <table class="table admin-table mb-0">
              <thead>
                <tr>
                  <th>Sản phẩm</th>
                  <th>Còn lại</th>
                  <th>Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="p : ${lowStockProducts}">
                  <td th:text="${p.name}"></td>
                  <td>
                    <span
                      class="badge bg-danger"
                      th:text="${p.stockQty}"
                    ></span>
                  </td>
                  <td>
                    <a
                      th:href="@{/admin/products/{id}/edit(id=${p.id})}"
                      class="btn btn-sm btn-gradient"
                      >Nhập thêm</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const revenueCanvas = document.getElementById("revenueChart");
        if (revenueCanvas && typeof Chart !== "undefined") {
          new Chart(revenueCanvas.getContext("2d"), {
            type: "line",
            data: {
              labels: ["T2", "T3", "T4", "T5", "T6", "T7", "CN"],
              datasets: [
                {
                  label: "Doanh thu",
                  data: [12, 19, 15, 25, 22, 30, 28],
                  borderColor: "#667eea",
                  backgroundColor: "rgba(102,126,234,0.1)",
                  borderWidth: 2,
                  fill: true,
                  tension: 0.4,
                },
              ],
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: { y: { beginAtZero: true } },
            },
          });
        }
        const statusCanvas = document.getElementById("statusChart");
        if (statusCanvas && typeof Chart !== "undefined") {
          new Chart(statusCanvas.getContext("2d"), {
            type: "doughnut",
            data: {
              labels: [
                "PENDING",
                "CONFIRMED",
                "SHIPPING",
                "COMPLETED",
                "CANCELLED",
              ],
              datasets: [
                {
                  data: [1, 1, 1, 1, 1],
                  backgroundColor: [
                    "#ECC94B",
                    "#4299E1",
                    "#ED8936",
                    "#48BB78",
                    "#FC8181",
                  ],
                },
              ],
            },
            options: { cutout: "65%", plugins: { legend: { display: false } } },
          });
        }
      });
    </script>
  </body>
</html>
